var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral branca + topo com busca e "ver como"; área de trabalho cinza-clara com cards brancos arredondados; verde vivo marca ação e progresso */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#f5f6f8; --surface-3:#eaecef; --line:#e5e7eb; --card-line:#eceef1;
  --ink:#0f1113; --ink-2:#3a3f46; --muted:#737a84;
  --green:#22c55e; --green-ink:#052e14; --green-strong:#15803d; --green-soft:#e6f8ed; --green-line:#b7ebc9;
  --pill:#121417; --pill-ink:#ffffff;
  --ok:#16a34a; --warn:#c2740b; --bad:#dc2626; --info:#2563eb;
  --car-glass:#cfdbe3; --tire:#1d2024; --hub:#a9aeb4; --car-edge:#8a9097;
  --plate-band:#1d3f96;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --pop:0 12px 32px rgba(16,24,40,.14);
  --font:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:18px; --r:12px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e10; --surface:#15181b; --surface-2:#1b1f23; --surface-3:#242930; --line:#2a3036; --card-line:#22272c;
  --ink:#eef0f2; --ink-2:#c8cdd3; --muted:#8e959e;
  --green:#2fe06e; --green-ink:#04170a; --green-strong:#4ade80; --green-soft:#12301d; --green-line:#1f5a34;
  --pill:#eef0f2; --pill-ink:#0c0e10;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --car-glass:#5d7180; --tire:#050607; --hub:#7c8389; --car-edge:#4b535b;
  --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e10; --surface:#15181b; --surface-2:#1b1f23; --surface-3:#242930; --line:#2a3036; --card-line:#22272c;
  --ink:#eef0f2; --ink-2:#c8cdd3; --muted:#8e959e;
  --green:#2fe06e; --green-ink:#04170a; --green-strong:#4ade80; --green-soft:#12301d; --green-line:#1f5a34;
  --pill:#eef0f2; --pill-ink:#0c0e10;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --car-glass:#5d7180; --tire:#050607; --hub:#7c8389; --car-edge:#4b535b;
  --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
a.lk{color:var(--green-strong);font-weight:600}
a.lk:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num,td.n{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:20px;height:20px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-block:26px 18px}
.side-in{padding-inline:20px;display:flex;flex-direction:column;gap:22px;flex:1}
.logo{display:flex;align-items:baseline;gap:2px;font-weight:800;font-size:26px;letter-spacing:-.03em;padding-inline:10px}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.nav{display:flex;flex-direction:column;gap:18px}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-g > span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 12px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--surface-3);color:var(--ink);font-weight:700}
.nav a.on svg{color:var(--green-strong)}
.nav a em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:var(--pill);color:var(--pill-ink);border-radius:20px;padding:1px 8px}
.side-card{margin-top:auto;background:var(--green-soft);border:1px solid var(--green-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.side-card svg.car{width:100%;max-width:180px;height:auto;display:block;margin:0 auto}
.side-card b{font-size:13px}
.side-card p{font-size:12px;color:var(--ink-2)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;min-height:72px;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.gsearch{position:relative;flex:0 1 340px;min-width:0}
.gsearch input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 12px 9px 38px}
.gsearch > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:6px;z-index:40;max-height:70vh;overflow:auto;min-width:280px}
.pop .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.pop .it:hover,.pop .it:focus{background:var(--surface-2)}
.pop .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative}
.icon-btn:hover{border-color:var(--ink-2)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}
.me{position:relative}
.me > button{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:12px;text-align:left}
.me > button:hover{background:var(--surface-2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--green);color:var(--green-ink);flex:none}
.av.sm{width:30px;height:30px;font-size:11.5px}
.av.xs{width:24px;height:24px;font-size:10px}
.av.g{background:var(--surface-3);color:var(--ink-2)}
.me .nm b{display:block;font-size:14px;line-height:1.2}
.me .nm span{font-size:12.5px;color:var(--muted)}
.me .pop{left:auto;right:0;width:300px}
.content{padding-block:26px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ---------- page head ---------- */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.phead .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.phead .t p{color:var(--muted)}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a:hover{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.pri:hover{filter:brightness(.96)}
.btn.dark{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.xs{padding:3px 10px;font-size:12px}
.btn.lg{padding:12px 22px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button,.tabs a{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.tabs .on{color:var(--ink);border-bottom-color:var(--green)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button.on.ok{background:var(--green);color:var(--green-ink)}
.seg button.on.warn{background:var(--warn);color:#fff}
.seg button.on.bad{background:var(--bad);color:#fff}
.switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:500}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:38px;height:22px;border-radius:20px;background:var(--surface-3);position:relative;transition:background .15s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked + i{background:var(--green)}
.switch input:checked + i::after{left:19px}
.switch input:focus-visible + i{outline:2px solid var(--green);outline-offset:2px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card > header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 0;flex-wrap:wrap}
.card > header .ht{display:flex;flex-direction:column;gap:2px;min-width:0}
.card > header .ht p{color:var(--muted);font-size:13px}
.card > .bd{padding:16px 20px 20px}
.card > .bd.flush{padding:8px 0 4px}
.card.pad{padding:18px 20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.g-dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr)}
.g-dash2{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr)}
.kpis{grid-column:span 2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.kpi .top{display:flex;align-items:center;gap:10px}
.kpi .ico{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink);flex:none}
.kpi .top .btn{margin-left:auto}
.kpi .lb{color:var(--ink-2);font-weight:500}
.kpi .vl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi .vl b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.trend.up{color:var(--green-strong)}
.trend.down{color:var(--bad)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.stat-row.s5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat-row.s5 b{font-size:20px}
.stat b{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--green-soft);color:var(--green-strong)}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.chip.info{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}
.chip.dark{background:var(--pill);color:var(--pill-ink)}
.chip.line{background:transparent;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- plate + car ---------- */
.plate{display:inline-flex;flex-direction:column;border:1.5px solid #2b2f33;border-radius:4px;background:#fff;color:#111;overflow:hidden;line-height:1;flex:none}
.plate i{font-style:normal;background:var(--plate-band);color:#fff;font:700 6px/1 var(--font);letter-spacing:.22em;text-align:center;padding:2px 4px}
.plate span{font:800 13px/1 var(--font);letter-spacing:.08em;padding:3px 7px 2px;text-align:center}
.photo{position:relative;aspect-ratio:16/10;max-width:100%;background:radial-gradient(120% 90% at 50% 30%,var(--surface) 0%,var(--surface-2) 60%,var(--surface-3) 100%);overflow:hidden}
.photo::after{content:"";position:absolute;left:12%;right:12%;bottom:17%;height:10px;border-radius:50%;background:var(--ink);opacity:.08;filter:blur(3px)}
.photo svg.car{position:absolute;left:50%;bottom:19%;width:76%;transform:translateX(-50%);z-index:1}
.photo .tl{position:absolute;top:10px;left:10px;z-index:2}
.photo .tr{position:absolute;top:10px;right:10px;z-index:2}
.photo .bl{position:absolute;bottom:10px;left:10px;z-index:2;display:flex;gap:5px}
.thumb{width:64px;height:48px;border-radius:12px;overflow:hidden;flex:none;background:var(--surface-2);position:relative}
.thumb svg.car{position:absolute;left:8%;width:84%;bottom:18%}

/* ---------- vehicle grid ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}
.vcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.vcard:hover{border-color:var(--green-line)}
.vcard .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.vcard h3{font-size:17px}
.vcard .ver{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price s{font-size:12px;font-weight:500;color:var(--muted);margin-right:5px}
.track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.track i{height:5px;border-radius:3px;background:var(--surface-3)}
.track i.ok{background:var(--green)}
.track i.atencao{background:var(--warn)}

/* ---------- forms ---------- */
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;min-width:0;width:100%}
textarea.inp{resize:vertical}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .inp{width:auto}
.toolbar .search{flex:1 1 220px;max-width:360px;position:relative}
.toolbar .search .inp{width:100%;padding-left:36px;border-radius:999px}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar select.inp{border-radius:999px;padding-inline:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
label.f .inp{font-weight:400;font-size:14px;color:var(--ink)}
label.f small{font-weight:400;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
.form .wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--green);flex:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px}
.sec-t{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.sec-t p{color:var(--muted);font-size:13px;max-width:70ch}

/* ---------- esteira ---------- */
.esteira{display:grid;grid-template-columns:repeat(8,minmax(104px,1fr));overflow-x:auto;background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);padding:6px;gap:4px}
.est{border:0;background:none;padding:10px 10px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;cursor:pointer;text-align:left;border-radius:12px;min-width:0}
.est:hover{background:var(--surface-2)}
.est.on{background:var(--surface-3)}
.est .n{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.est .l{font-weight:600;font-size:12.5px;line-height:1.25}
.est .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:11px;font-weight:700;color:var(--muted);background:var(--surface)}
.est.ok .dot{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.est.atencao .dot{background:var(--warn);border-color:var(--warn);color:#fff}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.late td{background:color-mix(in srgb,var(--bad) 5%,transparent)}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line)}
.tbl .sub{display:block;font-size:12px;color:var(--muted)}
.cardtbl{padding:6px 6px 8px}

/* ---------- lists / bars ---------- */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 18px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-weight:600}
.rows{display:flex;flex-direction:column}
.rows > .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rows > .row:last-child{border-bottom:0}
.hbars{display:flex;flex-direction:column;gap:16px}
.hbar{display:flex;flex-direction:column;gap:7px;color:inherit}
.hbar .t{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.hbar .t b{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.hbar .tr{height:9px;border-radius:9px;background:repeating-linear-gradient(-45deg,var(--surface-3) 0 4px,var(--surface-2) 4px 8px);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:9px;background:var(--pill)}
.hbar .tr i.g{background:var(--green)}
.hbar .tr i.w{background:var(--warn)}
.prod{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.prod:last-child{border-bottom:0}
.prod .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prod .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.legend{display:flex;flex-direction:column;gap:12px;flex:1;min-width:150px}
.legend .it{display:flex;gap:9px;align-items:flex-start}
.legend .sw{width:10px;height:10px;border-radius:3px;margin-top:5px;flex:none}
.split{display:flex;gap:20px;align-items:center;flex-wrap:wrap}

/* ---------- chart ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--pop);border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%)}
.chart .tip b{display:block;font-size:13px}
.lg-inline{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.lg-inline span{display:inline-flex;align-items:center;gap:6px}
.lg-inline i{width:16px;height:0;border-top:2px solid var(--ink)}
.lg-inline i.d{border-top:2px dashed var(--muted)}

/* ---------- calendar ---------- */
.cal{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px}
.cal .hd{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.cal .hd div{display:flex;gap:2px}
.cal .hd button{border:0;background:none;cursor:pointer;border-radius:8px;padding:3px;color:var(--ink-2)}
.cal .hd button:hover{background:var(--surface-2)}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px}
.cal .gr span{color:var(--muted);font-weight:600;font-size:11.5px;padding-bottom:4px}
.cal .gr button{border:0;background:none;cursor:pointer;aspect-ratio:1;border-radius:50%;position:relative;font-variant-numeric:tabular-nums;color:var(--ink);max-width:36px;margin:auto;width:100%}
.cal .gr button.out{color:var(--muted);opacity:.55}
.cal .gr button:hover{background:var(--surface-2)}
.cal .gr button.ev::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--green)}
.cal .gr button.today{background:var(--pill);color:var(--pill-ink);font-weight:700}
.cal .gr button.sel{outline:2px solid var(--green);outline-offset:-2px}
.evs{display:flex;flex-direction:column;gap:6px}
.ev{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:7px 9px;border-radius:9px;background:var(--surface-2)}
.ev b{font-weight:600}

/* ---------- wizard ---------- */
.steps{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border:1px solid var(--card-line);border-radius:999px;padding:5px}
.steps button{border:0;background:none;border-radius:999px;padding:7px 13px;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap;font-weight:600;font-size:12.5px;color:var(--muted)}
.steps button i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:11px}
.steps button.done i{background:var(--green);color:var(--green-ink)}
.steps button.on{background:var(--pill);color:var(--pill-ink)}
.steps button.on i{background:var(--green);color:var(--green-ink)}
.wiz{max-width:920px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wiz.wide{max-width:1100px}
.wiz-ft{display:flex;justify-content:space-between;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .nm{font-weight:500;min-width:0}
.item .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .cost{width:130px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shot{border:1.5px dashed var(--line);border-radius:14px;aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--surface-2);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px;text-align:center}
.shot.ok{border-style:solid;border-color:var(--green);color:var(--green-strong);background:var(--green-soft)}
.pick{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;flex-wrap:wrap}
.pick .who{flex:1;min-width:150px}
.optcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.optcard{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px}
.optcard:hover{border-color:var(--ink-2)}
.optcard.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green);background:var(--green-soft)}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--card-line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col > header{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 2px;font-weight:700}
.col > header span{display:flex;align-items:center;gap:8px}
.col > header i{width:8px;height:8px;border-radius:50%;background:var(--muted)}

function etapa(v,k){
 switch(k){
  case 'avaliacao':return v.aval.done?'ok':'pendente';
  case 'precificacao':return v.venda>0?'ok':'pendente';
  case 'negEntrada':return v.negEntrada?'ok':'pendente';
  case 'pericia':return v.pericia.status==='aprovado'?'ok':v.pericia.status==='reprovado'?'atencao':'pendente';
  case 'recebimento':{const s=REC.map(([r])=>v.receb[r]);return s.every(x=>x!=='pendente')?'ok':s.some(x=>x!=='pendente')?'atencao':'pendente'}
  case 'servicos':{if(!v.aval.done)return 'pendente';if(v.servicos.every(s=>s.feito))return 'ok';return v.servicos.some(s=>s.feito||s.st==='fazendo')?'atencao':'pendente'}
  case 'anuncios':{const c=pubCount(v),t=portaisAtivos().length;return v.status==='vendido'?'ok':c>=t-1?'ok':c>0?'atencao':'pendente'}
  case 'negSaida':{const a=negAberta(v.id);return v.status==='vendido'?'ok':(a&&a.saidaId===v.id)?'atencao':'pendente'}
 }
}
function pendencias(v){
 if(v.status!=='estoque')return [];
 const p=[];
 if(!v.aval.done)p.push('avaliacao');
 else{
  if(!(v.venda>0))p.push('precificacao');
  if(!v.negEntrada)p.push('negociacao');
  if(v.pericia.status!=='aprovado')p.push('pericia');
  REC.forEach(([k])=>{if(v.receb[k]==='pendente')p.push(k)});
  if(v.servicos.some(s=>!s.feito))p.push('servico');
  if(v.fotos<(+CFG().loja.kmMinFotos||8))p.push('foto');
  if(!pubCount(v))p.push('anuncio');
 }
 if(negAberta(v.id))p.push('proposta');
 return p;
}
function statusChip(v){
 if(v.status==='vendido')return chip('Vendido','ok dot');
 if(v.status==='devolvido')return chip('Devolvido','bad dot');
 const p=pendencias(v);
 if(p.includes('avaliacao'))return chip('Avaliação pendente','warn dot');
 if(p.includes('precificacao'))return chip('Precificação pendente','warn dot');

 return chip('Em preparação','dot');
}
function negCalc(n){

 const total=saida-ent+deb-(+n.desconto||0);
 const pago=n.pagamentos.reduce((a,p)=>a+(+p.valor||0),0);
 return {saida,ent,deb,total,pago,falta:Math.round((Math.abs(total)-pago)*100)/100};
}

function anunStatus(v,k){

function contratoTexto(n,k){
 const cl=S.cli[n.clienteId]||{nome:'[CLIENTE]',doc:'[CPF]',cidade:'[CIDADE]',tel:''};
 const L=CFG().loja, c=negCalc(n), hoje=TODAY.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
 const vd=v=>v?`${v.marca} ${v.modelo} ${v.versao}, ano ${v.anoFab}/${v.anoMod}, cor ${v.cor.toLowerCase()}, placa ${v.placa||'(zero km)'}, Renavam ${v.renavam||'—'}, ${numf(v.km)} km`:'[VEÍCULO]';
 const sv=S.veh[n.saidaId], ev=n.entradas.map(e=>S.veh[e.vid]);
 const pags=n.pagamentos.map(p=>`  • ${p.forma}: ${brl2(p.valor)}, com vencimento em ${dtf(p.data)} (${p.quem.toLowerCase()} paga)`).join('\n')||'  • A definir';
 const ass=`\n\n${L.cidade.split('-')[0]}, ${hoje}.\n\n\n_______________________________          _______________________________\n${L.nome}                                ${cl.nome}`;
 const partes=`LOJA: ${L.nome}, CNPJ ${L.cnpj}, com sede em ${L.endereco}, ${L.cidade}.\nCLIENTE: ${cl.nome}, CPF ${cl.doc}, residente em ${cl.cidade}.`;
 switch(k){
  case 'compra-venda':return `CONTRATO PARTICULAR DE COMPRA E VENDA DE VEÍCULO\nNegociação nº ${n.id} · ${NEG_TIPOS[n.tipo]}\n\n${partes}\n\nCLÁUSULA 1ª · OBJETO\n${sv?'A LOJA vende ao CLIENTE o veículo '+vd(sv)+', pelo valor de '+brl2(c.saida)+'.':''}${ev.length?'\n'+(n.tipo==='compra'?'O CLIENTE vende à LOJA':'O CLIENTE entrega à LOJA, como parte do pagamento,')+' o(s) veículo(s): '+ev.map((v,i)=>vd(v)+' ('+brl2(n.entradas[i].valor)+')').join('; ')+'.':''}\n\nCLÁUSULA 2ª · PREÇO E PAGAMENTO\nSaldo da operação: ${brl2(Math.abs(c.total))}, ${c.total>=0?'a ser pago pelo CLIENTE':'a ser pago pela LOJA'}, da seguinte forma:\n${pags}\n\nCLÁUSULA 3ª · ESTADO DO VEÍCULO\nO comprador declara ter vistoriado o veículo e recebê-lo no estado em que se encontra${sv&&sv.garantia!=='Sem garantia'?', com garantia de '+sv.garantia+' para motor e câmbio':''}.\n\nCLÁUSULA 4ª · TRANSFERÊNCIA\nA transferência de propriedade junto ao DETRAN deverá ser feita em até 30 dias, sob responsabilidade do comprador.\n\nCLÁUSULA 5ª · FORO\nFica eleito o foro da comarca de ${L.cidade}.${ass}`;
  case 'procuracao-venda':return `PROCURAÇÃO PARA VENDA DE VEÍCULO\n\nOUTORGANTE: ${L.nome}, CNPJ ${L.cnpj}.\nOUTORGADO: ${cl.nome}, CPF ${cl.doc}.\n\nPoderes para representar o outorgante perante o DETRAN e demais órgãos, assinar o documento de transferência e praticar todos os atos necessários à transferência do veículo ${vd(sv)}.${ass}`;
  case 'procuracao-condutor':return `PROCURAÇÃO PARA APRESENTAÇÃO DE CONDUTOR INFRATOR\n\nOUTORGANTE: ${L.nome}, CNPJ ${L.cnpj}.\nOUTORGADO: ${cl.nome}, CPF ${cl.doc}.\n\nPoderes para indicar o condutor responsável por infrações de trânsito cometidas com o veículo ${vd(sv)} a partir da data de entrega, até a conclusão da transferência.${ass}`;
  case 'procuracao-compra':return `PROCURAÇÃO PARA COMPRA DE VEÍCULO\n\nOUTORGANTE: ${cl.nome}, CPF ${cl.doc}.\nOUTORGADO: ${L.nome}, CNPJ ${L.cnpj}.\n\nPoderes para vender, transferir e dar quitação do veículo ${vd(ev[0])}, podendo assinar o documento de transferência em nome do outorgante.${ass}`;
  case 'termo-entrega':return `TERMO DE ENTREGA E RESPONSABILIDADE\n\nDeclaro ter recebido de ${L.nome} o veículo ${vd(sv)}${n.agenda.entrega?', em '+dtf(n.agenda.entrega)+' às '+n.agenda.hEntrega:''}.\nA partir desta data assumo total responsabilidade civil e criminal pelo veículo, inclusive multas e infrações, até a efetiva transferência.${ass}`;
  case 'termo-recebimento':return `TERMO DE RECEBIMENTO E RESPONSABILIDADE\n\n${L.nome} declara ter recebido de ${cl.nome} o(s) veículo(s): ${ev.map(vd).join('; ')}${n.agenda.receb?', em '+dtf(n.agenda.receb)+' às '+n.agenda.hReceb:''}.\nO proprietário anterior responde por débitos, multas e infrações anteriores a esta data.${ass}`;
  case 'consignacao':return `CONTRATO DE CONSIGNAÇÃO DE VEÍCULO\n\n${partes.replace('LOJA:','CONSIGNATÁRIA:').replace('CLIENTE:','CONSIGNANTE:')}\n\nO CONSIGNANTE entrega à CONSIGNATÁRIA, para venda, o veículo ${vd(ev[0])}.\nValor líquido de repasse ao CONSIGNANTE: ${brl2(n.entradas[0]?.valor)}, a ser pago em até 5 dias úteis após a venda.\nPrazo de consignação: 90 dias, renováveis. Despesas de preparação previamente aprovadas serão descontadas do repasse.${ass}`;
  case 'residencia':return `DECLARAÇÃO DE RESIDÊNCIA\n\nEu, ${cl.nome}, CPF ${cl.doc}, declaro para os devidos fins que resido em ${cl.cidade}.\nDeclaro ainda estar ciente de que a falsidade desta declaração configura crime previsto no Código Penal.${ass}`;
 }
}

const RELS_V3=[['estoque','Giro e margem','Dias em estoque, custo, gastos e margem prevista de cada veículo'],['anuncios','Anúncios por canal','Veículos em estoque e seus anúncios em cada canal ativo'],['atendimentos','Atendimentos','Leads por origem, responsável e motivo de insucesso'],['clientes','Clientes por período','Clientes de negociações aprovadas no período (máximo 60 dias)'],['aniversario','Aniversariantes','Clientes que fazem aniversário no mês escolhido'],['servicos','Serviços por fornecedor','Previsto x realizado por fornecedor'],['dre','Resultado por conta','Títulos pagos e recebidos agrupados por conta contábil']];
function relData(k){
 if(k==='anuncios'){const PA=portaisAtivos();return {h:['Placa','Veículo','Preço'].concat(PA.map(p=>p[1])),r:estoque().map(v=>[v.placa||'Zero km',nome(v)+' '+v.anoMod,brl(preco(v))].concat(PA.map(([p])=>v.pubs[p]?'Sim':'Não')))}}
 if(k==='clientes'){const de=UI.relDe,ate=UI.relAte;const ns=vals(S.neg).filter(n=>{const ap=n.hist.find(h=>['Aprovada','Finalizada'].includes(h.a));return ap&&ap.d>=de&&ap.d<=ate&&n.status!=='cancelada'});return {h:['Cliente','Celular','Cidade','Negociação','Tipo','Status'],r:ns.map(n=>{const c=S.cli[n.clienteId]||{};return [c.nome,c.tel,c.cidade,'#'+n.id,NEG_TIPOS[n.tipo],NEG_STATUS[n.status][0]]})}}
 if(k==='aniversario'){const m=String(UI.relMes).padStart(2,'0');return {h:['Cliente','Aniversário','Celular','E-mail'],r:vals(S.cli).filter(c=>c.nasc&&c.nasc.slice(5,7)===m).sort((a,b)=>a.nasc.slice(8).localeCompare(b.nasc.slice(8))).map(c=>[c.nome,c.nasc.slice(8)+'/'+m,c.tel,c.email])}}
 if(k==='estoque'){return {h:['Veículo','Placa','Dias','Compra','Gastos previstos','Venda','Margem'],r:estoque().sort((a,b)=>daysSince(b.entrada)-daysSince(a.entrada)).map(v=>[nome(v)+' '+v.anoMod,v.placa||'Zero km',daysSince(v.entrada),brl(v.compra),brl(gastoPrev(v)),v.venda?brl(preco(v)):'—',v.venda?brl(preco(v)-v.compra-gastoPrev(v)):'—'])}}
 if(k==='servicos'){return {h:['Fornecedor','Especialidade','Serviços','Concluídos','Previsto','Realizado'],r:vals(S.forn).map(f=>{const ss=vehList().flatMap(v=>v.servicos.filter(s=>+s.f===f.id));return [f.nome,f.tipo,ss.length,ss.filter(s=>s.feito).length,brl(ss.reduce((a,s)=>a+s.prev,0)),brl(ss.filter(s=>s.feito).reduce((a,s)=>a+(+s.real||0),0))]})}}
 if(k==='atendimentos'){return {h:['Lead','Origem','Responsável','Etapa','Motivo de insucesso','Entrada'],r:vals(S.lead).sort((a,b)=>b.data.localeCompare(a.data)).map(l=>[l.nome,l.origem,uNome(l.uid),LEAD_ST.find(x=>x[0]===l.status)[1],l.motivo||'—',dtf(l.data)])}}
 if(k==='dre'){const m={};titulos().filter(t=>t.pago).forEach(t=>{const c=contaById(t.conta);const key=c?c.grupo+' › '+c.nome:'Sem conta';m[key]=(m[key]||0)+(t.tipo==='R'?t.valor:-t.valor)});return {h:['Agrupamento › conta','Resultado'],r:Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,brl2(v)])}}
}

 if(f.tab==='pagar')L=L.filter(t=>t.tipo==='P');
 if(f.tab==='receber')L=L.filter(t=>t.tipo==='R');
 if(f.st==='aberto')L=L.filter(t=>!t.pago);

function etapa(v,k){
 switch(k){
  case 'avaliacao':return v.aval.done?'ok':'pendente';
  case 'precificacao':return v.venda>0?'ok':'pendente';
  case 'negEntrada':return v.negEntrada?'ok':'pendente';
  case 'pericia':return ['aprovado','ressalvas','na'].includes(v.pericia.status)?'ok':v.pericia.status==='reprovado'?'atencao':'pendente';
  case 'recebimento':{const s=REC.map(([r])=>v.receb[r]);return s.every(x=>x!=='pendente')?'ok':s.some(x=>x!=='pendente')?'atencao':'pendente'}
  case 'servicos':{if(!v.aval.done)return 'pendente';const S2=v.servicos.filter(s=>s.status!=='recusado');if(S2.every(s=>s.feito))return 'ok';return S2.some(s=>s.feito||s.st==='fazendo')?'atencao':'pendente'}
  case 'anuncios':{const c=pubCount(v),t=portaisAtivos().length;if(v.status==='vendido')return 'ok';if(portaisAtivos().some(([p])=>['erro','errodest'].includes(anunStatus(v,p))))return 'atencao';return c>=t-1?'ok':c>0?'atencao':'pendente'}

 }
}

function avalResumoTbl(v,recusar){

 Object.entries(v.aval.itens).forEach(([k,o])=>{if(o.s==='reparo'){const [a,it]=k.split('|');rows.push({k,area:AREAS.find(x=>x.k===a)?.n||a,it,tipo:o.tipo||'',obs:o.obs||'',v:+o.v||0})}});
 Object.entries(v.aval.serv).forEach(([n,val])=>{if(+val>0)rows.push({k:'serv|'+n,area:'Preparação',it:n,tipo:'Serviço',obs:'',v:+val})});
 if(!rows.length)return '<div class="empty">Nenhum reparo ou serviço previsto.</div>';

 const tot=rows.filter(r=>!rec[r.k]).reduce((a,r)=>a+r.v,0), totRec=rows.filter(r=>rec[r.k]).reduce((a,r)=>a+r.v,0);

function precCalc(v){
 const L=CFG().loja, pr=v.prec;

 const impC=imp(cv), comC=com(cv,L.comissaoCompraPct)+com(cv,L.comissaoVendaPct);
 const sugerido=Math.max(0,Math.round((cv-mR-gp-gar-impC-comC)/100)*100);

}

 const PA=portaisAtivos(), f=UI.anf, q=f.q.trim().toLowerCase();

 const cont={};Object.keys(ANUN_ST).forEach(k=>cont[k]=0);base.forEach(v=>PA.forEach(([k])=>cont[anunStatus(v,k)]++));
 const ERR=errosAnuncios().filter(e=>(!f.integ||e.k===f.integ)&&(!q||`${e.v.placa} ${e.v.marca} ${e.v.modelo} ${e.msg}`.toLowerCase().includes(q)));
 const errGrupo={};ERR.forEach(e=>{(errGrupo[e.cod]=errGrupo[e.cod]||{msg:e.msg.replace(/\(.*\)/,'').trim(),sol:e.sol,n:0}).n++});
 let L=base.filter(v=>!q||`${v.placa} ${v.marca} ${v.modelo}`.toLowerCase().includes(q));
 if(f.st)L=L.filter(v=>PA.some(([k])=>(!f.integ||f.integ===k)&&anunStatus(v,k)===f.st));
 else if(f.integ)L=L.filter(v=>anunStatus(v,f.integ)!=='nao'||v.status==='estoque');
 if(f.dest)L=L.filter(v=>v.destaques&&Object.values(v.destaques).some(Boolean));

/* ================= PAINEL com abas ================= */
const PAINEL_TABS=[['estoque','Estoque'],['negociacoes','Negociações'],['anuncios','Anúncios'],['crm','CRM']];
const painelTabs=()=>`<div class="tabs">${PAINEL_TABS.map(([k,l])=>`<button type="button" class="${UI.painelTab===k?'on':''}" data-act="ui" data-k="painelTab" data-v="${k}">${l}</button>`).join('')}</div>`;
function vendasMes(y,m){return vals(S.neg).filter(n=>n.status==='finalizada'&&n.saidaId&&['venda','troca'].includes(n.tipo)).map(n=>({n,d:S.veh[n.saidaId].saida||n.criado})).filter(x=>{const d=new Date(x.d+'T12:00');return d.getFullYear()===y&&d.getMonth()===m})}
function acumChart(cur,prev,diasMes){
 const W=640,H=230,L=44,R=12,T=14,B=28;
 const acc=(arr,n)=>{const a=Array(n).fill(0);arr.forEach(x=>{const dd=+x.d.slice(8)-1;if(dd<n)a[dd]+=1});for(let i=1;i<n;i++)a[i]+=a[i-1];return a};
 const a1=acc(cur,TODAY.getDate()), a0=acc(prev,diasMes);
 const max=Math.max(1,...a0,...a1);const x=i=>L+i*(W-L-R)/(diasMes-1),y=v=>T+(H-T-B)*(1-v/max);
 const path=a=>a.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
 const ticks=[...new Set([0,Math.ceil(max/2),max])];
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vendas acumuladas por dia: mês atual e anterior">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="4 5"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--font)">${t}</text>`).join('')}${[1,5,10,15,20,25,diasMes].map(d=>`<text x="${x(d-1)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--font)">${d}</text>`).join('')}<path d="${path(a0)}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 5"/><path d="${path(a1)}" fill="none" stroke="var(--green)" stroke-width="3" stroke-linejoin="round"/><circle cx="${x(a1.length-1)}" cy="${y(a1[a1.length-1])}" r="5" fill="var(--green)" stroke="var(--surface)" stroke-width="2"/></svg></div>`;
}
function viewPainel(){
 const t=UI.painelTab;
 if(t==='estoque'||!PAINEL_TABS.some(p=>p[0]===t))return painelEstoque().replace('<div class="grid g-dash">',painelTabs()+'<div class="grid g-dash">');
 const head=phead('Painel',`Visão geral da ${esc(CFG().loja.fantasia)}`)+painelTabs();
 if(t==='negociacoes'){
  const y=TODAY.getFullYear(),m=TODAY.getMonth(),pm=m===0?11:m-1,py=m===0?y-1:y;

function afterSet(path){
 const ks=path.split('.');
 if(ks[0]==='neg'&&ks[2]==='tipo'){const n=S.neg[ks[1]];if(n.tipo==='venda')n.entradas=[];if(['compra','consignacao'].includes(n.tipo)){n.saidaId=null;n.valorSaida=0}}
 if(ks[0]==='cfg'&&ks[1]==='quadros'&&ks[3]==='ativo'&&!CFG().quadros.some(q=>q.ativo)){CFG().quadros[+ks[2]].ativo=true;toast('Mantenha ao menos um quadro ativo')}

 if(t.dataset.set){const old=getPathV(t.dataset.set);setPath(t.dataset.set,readVal(t));afterSet(t.dataset.set);auditSet(t.dataset.set,old);save();render();return}
 if(t.dataset.ui&&!t.dataset.live){setUI(t.dataset.ui,readVal(t));render();return}
 if(t.dataset.cost){S.veh[t.dataset.id].aval.itens[t.dataset.cost].v=+t.value||0;save();return}
 if(t.dataset.srv){S.veh[t.dataset.id].aval.serv[t.dataset.srv]=+t.value||0;save();return}
 if(t.dataset.avtipo){S.veh[t.dataset.id].aval.itens[t.dataset.avtipo].tipo=t.value;save();return}
 if(t.dataset.avobs){S.veh[t.dataset.id].aval.itens[t.dataset.avobs].obs=t.value;save();return}
 const ac=t.dataset.actChange; if(!ac)return;
 const CH={
  opc(){const v=S.veh[t.dataset.id];const o=t.dataset.o;v.opcionais=t.checked?[...new Set(v.opcionais.concat(o))]:v.opcionais.filter(x=>x!==o)},

  negAddEnt(){if(!t.value)return;const n=S.neg[t.dataset.id];const v=S.veh[+t.value];n.entradas.push({vid:v.id,valor:v.compra||v.fipe||0})},
  negAddDeb(){if(!t.value)return;const c=CFG().custos.find(x=>x.id===+t.value);S.neg[t.dataset.id].debitos.push({desc:c.nome,valor:c.valor||0})},
  addServCat(){if(!t.value)return;const c=CFG().custos.find(x=>x.id===+t.value);S.veh[t.dataset.id].servicos.push({n:c.nome,orig:c.ref,f:c.forn,prev:c.valor||0,real:0,feito:false,st:'afazer',data:''});toast(c.nome+' adicionado')},
  servSt(){setServSt(S.veh[t.dataset.id].servicos[+t.dataset.i],t.value)},

  cert(){const f=t.files&&t.files[0];if(!f)return;CFG().cert={nome:f.name,validade:addMonths(TODAY_ISO,12)};toast('Certificado registrado')}
 };

const FORMS={
 novaAval(d,f){
  let cid=+d.cli;
  if(!cid){if(!d.cliNome){toast('Escolha um proprietário ou informe o nome');return}cid=nextId();S.cli[cid]={id:cid,nome:d.cliNome,tel:d.cliTel||'',email:'',cidade:CFG().loja.cidade,nasc:'',doc:'',criado:TODAY_ISO}}
  const id=nextId(), km=+d.km||0;
  S.veh[id]={id,placa:(d.placa||'').toUpperCase(),zeroKm:km===0,marca:d.marca,modelo:d.modelo,versao:d.versao||'',anoFab:+d.anoFab,anoMod:+d.anoMod,cor:d.cor,km,cambio:d.cambio,combustivel:'Flex',carroceria:d.carroceria,portas:4,opcionais:[],renavam:'',chassi:'',tipo:'Carro',estoque:'showroom',neg:'proprio',status:'estoque',entrada:TODAY_ISO,saida:null,compra:0,venda:0,promo:0,fipe:+d.fipe||0,negEntrada:false,clienteId:cid,pericia:{status:'pendente',data:'',forn:'',obs:''},receb:{manual:'pendente',chave:'pendente',certificado:'pendente',seguranca:'pendente'},garantia:CFG().loja.garantiaPadrao,aval:{done:false,data:TODAY_ISO,avaliador:avaliadores()[0]||me().nome,solicitante:me().nome,testDrive:false,rodas:'Liga leve',chaveReserva:true,fotos:{},itens:{},serv:{},feedback:''},servicos:[],fotos:0,pubs:Object.fromEntries(['site'].concat(PORTAIS_CAT.map(p=>p[0])).map(k=>[k,false])),descricao:''};
  const neg=f.dataset.neg;
  if(neg){S.neg[neg].entradas.push({vid:id,valor:0});if(!S.neg[neg].clienteId)S.neg[neg].clienteId=cid}
  save();closeModal();UI.avalStep[id]=0;
  if(can('avaliacoes')){toast('Veículo criado. Avaliação aberta.');go(neg?'neg-'+neg:'aval-'+id)}else{toast('Avaliação solicitada. O avaliador foi notificado.');go(neg?'neg-'+neg:'v-'+id)}
 },
 cli(d,f){let id=+f.dataset.id;if(id)Object.assign(S.cli[id],d);else{id=nextId();S.cli[id]=Object.assign({id,criado:TODAY_ISO},d)}if(f.dataset.neg)S.neg[f.dataset.neg].clienteId=id;save();closeModal();toast('Cliente salvo');render()},
 forn(d,f,fd){let id=+f.dataset.id;const o={nome:d.nome,doc:d.doc,tipo:d.tipo,tel:d.tel,ativo:fd.has('ativo')};if(id)Object.assign(S.forn[id],o);else{id=nextId();S.forn[id]=Object.assign({id},o)}save();closeModal();toast('Fornecedor salvo');render()},
 lead(d,f,fd){
  const q=d.quadro?quadroById(d.quadro):quadroPara(d.origem);
  let uid=d.uid?+d.uid:proximoDaFila(q,true);
  const viaFila=!d.uid&&uid;
  if(!uid)uid=me().id;
  const id=nextId();S.lead[id]={id,nome:d.nome,tel:d.tel,status:'pendente',uid,origem:d.origem,quadro:q?q.id:null,vid:d.vid?+d.vid:null,desc:d.desc,data:TODAY_ISO,agenda:'',motivo:'',tags:fd.getAll('tags').map(Number)};
  save();closeModal();toast(viaFila?`Atendimento criado e distribuído para ${uNome(uid)} (fila de ${q.nome})`:'Atendimento criado');render();
 },
 motivo(d,f){const l=S.lead[f.dataset.id];l.status='insucesso';l.motivo=d.motivo;save();closeModal();toast('Atendimento encerrado: '+d.motivo);render()},
 agenda(d,f){const l=S.lead[f.dataset.id];l.status=f.dataset.st;l.agenda=d.agenda;save();closeModal();toast(f.dataset.st==='visita'?'Visita registrada':'Atendimento agendado para '+dtf(d.agenda));render()},
 coment(d,f){const n=S.neg[f.dataset.id];n.coments.push({q:me().nome,d:TODAY_ISO,t:d.t});save();render()},
 user(d,f,fd){
  let id=+f.dataset.id;
  if(users().some(u=>u.email.toLowerCase()===d.email.toLowerCase()&&u.id!==id)){toast('Já existe um usuário com este e-mail');return}
  const o={nome:d.nome,email:d.email,tel:d.tel,doc:d.doc,perfil:d.perfil,twofa:fd.has('twofa')};
  if(id){if(id===CFG().atual&&o.perfil!=='revenda'&&CFG().usuarios[id].perfil==='revenda'&&!users().some(u=>u.id!==id&&u.perfil==='revenda'&&u.status==='ativo')){toast('A loja precisa de ao menos um usuário Revenda ativo');return}Object.assign(CFG().usuarios[id],o)}
  else{id=nextId();CFG().usuarios[id]=Object.assign({id,status:'aguardando',ultimo:''},o)}
  const qs=fd.getAll('quadros').map(Number);
  CFG().quadros.forEach(q=>{const has=q.equipe.some(e=>e.uid===id);if(qs.includes(q.id)&&!has)q.equipe.push({uid:id,fila:false});if(!qs.includes(q.id)&&has)q.equipe=q.equipe.filter(e=>e.uid!==id)});

function modDe(h){if(/^v-\d+$/.test(h))return 'veiculos';if(/^aval-\d+$/.test(h))return 'avaliacoes';if(/^neg-\d+$/.test(h))return 'negociacoes';if(/^int-\d+$/.test(h))return 'intermediacao';if(/^cli-\d+$/.test(h))return 'clientes';return VIEWS[h]?h:'painel'}
function route(){
 const h=curHash(), mod=modDe(h); let m;
 if(!can(mod))return lockedView(mod);
 if((m=h.match(/^v-(\d+)$/)))return viewVeiculo(+m[1]);
 if((m=h.match(/^aval-(\d+)$/)))return viewAval(+m[1]);
 if((m=h.match(/^neg-(\d+)$/)))return viewNeg(+m[1]);
 if((m=h.match(/^int-(\d+)$/)))return viewInter(+m[1]);
 if((m=h.match(/^cli-(\d+)$/)))return viewCliente(+m[1]);
 return VIEWS[mod]();
}

 if(!t||!v)return 'Tag ou veículo não encontrado';
 if(t.vid&&t.vid!==v.id)return `A tag ${t.cod} já está no ${nome(S.veh[t.vid])}`;
 const old=chvTagDe(v.id);if(old&&old.id!==t.id)return `Este veículo já usa a tag ${old.cod}`;
 t.vid=v.id;t.ativo=true;t.reserva=v.receb&&v.receb.chave==='entregue';chvLog(t,v.id,'vinculou');touch(v,'recebimento',`Tag ${t.cod} vinculada à chave`);return '';
}
function chvDesvincular(t,motivo){
 if(!t||!t.vid)return 'A tag não está vinculada';
 if(chvAberto(t.vid))return 'A chave está fora do quadro. Registre a devolução antes de desvincular.';
 const v=S.veh[t.vid];chvLog(t,t.vid,'desvinculou',motivo||'');t.vid=null;if(v)touch(v,null,`Tag ${t.cod} desvinculada${motivo?' · '+motivo:''}`);return '';
}
function chvNovaTag(box){const C=CV();C.seqTag++;const n=C.seqTag;const t={id:nextId(),cod:'PT-'+String(n).padStart(4,'0'),box:+box||(C.boxes[0]||{}).id,vid:null,reserva:false,ativo:true,obs:'',bat:100,mac:''};C.tags.push(t);return t}
function chvLiberar(v,txt){
 if(!v||!S.chv)return;const e=chvAberto(v.id);if(e){e.dev=dtNow();e.uidDev=me().id;e.obs=(e.obs?e.obs+' · ':'')+txt}
 const t=chvTagDe(v.id);if(t){chvLog(t,v.id,'desvinculou',txt);t.vid=null}
}

function chvBars(vals,labels,label,{h=190,every=1}={}){
 const W=640,H=h,L=30,R=8,T=12,B=26,max=Math.max(1,...vals),bw=(W-L-R)/vals.length,y=v=>T+(H-T-B)*(1-v/max);
 const ticks=[...new Set([0,Math.ceil(max/2),max])];
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="4 5"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end" font-size="11.5" fill="var(--muted)" font-family="var(--font)">${t}</text>`).join('')}${vals.map((v,i)=>`<rect x="${(L+i*bw+bw*.16).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw*.68).toFixed(1)}" height="${Math.max(0,H-B-y(v)).toFixed(1)}" rx="3" fill="${v?'var(--green)':'var(--surface-3)'}"><title>${esc(labels[i])}: ${v}</title></rect>${i%every===0?`<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="var(--muted)" font-family="var(--font)">${esc(labels[i])}</text>`:''}`).join('')}</svg></div>`;
}

let chvSig=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest&&e.target.closest('canvas.sig');if(!c)return;e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(x){}const r=c.getBoundingClientRect(),ctx=c.getContext('2d'),sx=c.width/r.width,sy=c.height/r.height;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';ctx.beginPath();ctx.moveTo((e.clientX-r.left)*sx,(e.clientY-r.top)*sy);chvSig={c,ctx,r,sx,sy}});
document.addEventListener('pointermove',e=>{if(!chvSig)return;const {c,ctx,r,sx,sy}=chvSig;ctx.lineTo((e.clientX-r.left)*sx,(e.clientY-r.top)*sy);ctx.stroke();c.dataset.drawn='1'});
document.addEventListener('pointerup',()=>{chvSig=null});
document.addEventListener('pointercancel',()=>{chvSig=null});

 if(!CHV_CAM.noBD&&'BarcodeDetector' in window){try{CHV_CAM.bd=CHV_CAM.bd||new BarcodeDetector({formats:['qr_code']});const r=await CHV_CAM.bd.detect(src);if(r&&r.length)return r[0].rawValue;if(src.tagName==='VIDEO')return null}catch(e){CHV_CAM.noBD=true}}
 if(!window.jsQR)return null;
 const sc=Math.min(1,960/Math.max(w0,h0)),w=Math.round(w0*sc),h=Math.round(h0*sc);
 const cv=CHV_CAM.cv||(CHV_CAM.cv=document.createElement('canvas'));cv.width=w;cv.height=h;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(src,0,0,w,h);
 const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:src.tagName==='VIDEO'?'dontInvert':'attemptBoth'});return r?r.data:null;
}
function chvCodDoQR(raw){raw=String(raw||'').trim();const m=raw.match(/PT-?\d{1,6}/i);return m?m[0].toUpperCase().replace(/^PT-?/,'PT-'):raw}
function chvScanAchou(raw){
 chvCamStop();const cod=chvCodDoQR(raw),t=chvTagCod(cod);
 try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
 if(!t){chvScanMsg(`O QR lido (${String(raw).slice(0,40)}) não é uma etiqueta do Pátio. Tente outro chaveiro ou digite o código.`,true);return}
 modalChvLer(t.cod);
}
function chvScanLoop(){

 const alvo=gTiles(d.gal).find(x=>{if(x===d.t)return false;const r=x.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
 if(alvo){const r=alvo.getBoundingClientRect();const depois=e.clientX>r.left+r.width/2;const ref=depois?alvo.nextSibling:alvo;if(ref!==d.t&&ref!==d.t.nextSibling){gFlip(d.gal,()=>d.gal.insertBefore(d.t,ref));gTiles(d.gal).forEach((x,i)=>{const s=x.querySelector('.n');if(s)s.textContent=i+1})}}

function fipeSerie(v){
 const R=rng(hashStr('fipe'+v.marca+v.modelo+v.versao+v.anoMod));const out=[];let val=+v.fipe||0;
 for(let i=0;i<6;i++){const d=new Date(TODAY);d.setDate(1);d.setMonth(d.getMonth()-i);out.unshift({d,val:Math.round(val)});const chg=-0.013+R()*0.017;val=val/(1+chg)}
 out.forEach((x,i)=>{const p=out[i-1];x.dv=p?x.val-p.val:0;x.dp=p&&p.val?x.dv/p.val*100:0;x.acc=out[0].val?(x.val-out[0].val)/out[0].val*100:0});
 return out;
}

const MERC_CID={pr:['Umuarama-PR','Maringá-PR','Cascavel-PR','Londrina-PR','Toledo-PR','Cianorte-PR','Paranavaí-PR','Curitiba-PR','Campo Mourão-PR'],br:['São Paulo-SP','Campinas-SP','Curitiba-PR','Belo Horizonte-MG','Goiânia-GO','Florianópolis-SC','Porto Alegre-RS','Ribeirão Preto-SP','Maringá-PR','Londrina-PR','Campo Grande-MS']};
const MERC_PORT=['Webmotors','OLX','iCarros','Mobiauto','Usadosbr','Na Pista'];
const KM_ANO=13500;
function mercGerar(v,f,seed){
 const R=rng(hashStr([v.marca,v.modelo,v.anoMod,f.reg,f.ano,seed].join('|')));
 const base=+v.fipe||+v.venda||60000, n=(f.reg==='br'?16:9)+Math.floor(R()*7), cid=MERC_CID[f.reg]||MERC_CID.pr, Y=TODAY.getFullYear();
 const vers=[v.versao,v.versao,v.versao.replace(/\s\S+$/,''),v.versao].filter(Boolean);
 const L=[];
 for(let i=0;i<n;i++){
  const ano=v.anoMod+(f.ano==='1'?Math.round(R()*2-1):0), idade=Math.max(.5,Y-ano+.4);
  const km=Math.max(2000,Math.round(idade*KM_ANO*(.5+R()*1.0)/100)*100), kmRef=idade*KM_ANO;
  const part=R()<.22;
  const p=base*(1+(ano-v.anoMod)*.065)*(1+(kmRef-km)/10000*.012)*(part?.95:1.04)*(.94+R()*.13);
  L.push({portal:MERC_PORT[Math.floor(R()*MERC_PORT.length)],versao:vers[Math.floor(R()*vers.length)],ano,km,cidade:cid[Math.floor(R()*cid.length)],preco:Math.round(p/100)*100,dias:3+Math.floor(R()*85),tipo:part?'Particular':'Loja'});
 }
 return L.sort((a,b)=>a.preco-b.preco);
}
function mercEnsure(v){
 v.prec=v.prec||{};const m=v.prec.merc;
 if(!m||!m.anuncios){v.prec.merc={f:{reg:'pr',ano:'0'},seed:1,em:nowISO(),por:'Pátio (automático)',anuncios:[]};v.prec.merc.anuncios=mercGerar(v,v.prec.merc.f,1)}
 return v.prec.merc;
}
function mercStats(v){
 const m=mercEnsure(v), L=m.anuncios;if(!L.length)return null;
 const P=L.map(x=>x.preco).sort((a,b)=>a-b), n=P.length, corte=Math.floor(n*.1), Pa=P.slice(corte,n-corte);
 const media=Math.round(Pa.reduce((a,x)=>a+x,0)/Pa.length), mediana=n%2?P[(n-1)/2]:Math.round((P[n/2-1]+P[n/2])/2);
 const kmMed=Math.round(L.reduce((a,x)=>a+x.km,0)/n/100)*100;
 const ajKm=Math.round(media*((kmMed-(+v.km||0))/10000*.012)/100)*100;
 return {n,media,mediana,min:P[0],max:P[n-1],kmMed,ajKm,ajustada:Math.max(0,media+ajKm),dias:Math.round(L.reduce((a,x)=>a+x.dias,0)/n),lojas:L.filter(x=>x.tipo==='Loja').length};
}

 return Math.max(0,Math.round((cv-mR-gastoPrev(v)-(+pr.simCompra.garantia||0)-imp(cv)-com(cv,L.comissaoCompraPct)-com(cv,L.comissaoVendaPct))/100)*100);
