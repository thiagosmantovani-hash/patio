<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pátio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra lateral branca + topo com busca e "ver como"; área de trabalho cinza-clara com cards brancos arredondados; verde vivo marca ação e progresso */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#f5f6f8; --surface-3:#eaecef; --line:#e5e7eb; --card-line:#eceef1;
  --ink:#0f1113; --ink-2:#3a3f46; --muted:#737a84;
  --green:#22c55e; --green-ink:#052e14; --green-strong:#15803d; --green-soft:#e6f8ed; --green-line:#b7ebc9;
  --pill:#121417; --pill-ink:#ffffff;
  --ok:#16a34a; --warn:#c2740b; --bad:#dc2626; --info:#2563eb;
  --car-glass:#cfdbe3; --tire:#1d2024; --hub:#a9aeb4; --car-edge:#8a9097;
  --plate-band:#1d3f96;
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --pop:0 12px 32px rgba(16,24,40,.14);
  --font:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:18px; --r:12px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e10; --surface:#15181b; --surface-2:#1b1f23; --surface-3:#242930; --line:#2a3036; --card-line:#22272c;
  --ink:#eef0f2; --ink-2:#c8cdd3; --muted:#8e959e;
  --green:#2fe06e; --green-ink:#04170a; --green-strong:#4ade80; --green-soft:#12301d; --green-line:#1f5a34;
  --pill:#eef0f2; --pill-ink:#0c0e10;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --car-glass:#5d7180; --tire:#050607; --hub:#7c8389; --car-edge:#4b535b;
  --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0e10; --surface:#15181b; --surface-2:#1b1f23; --surface-3:#242930; --line:#2a3036; --card-line:#22272c;
  --ink:#eef0f2; --ink-2:#c8cdd3; --muted:#8e959e;
  --green:#2fe06e; --green-ink:#04170a; --green-strong:#4ade80; --green-soft:#12301d; --green-line:#1f5a34;
  --pill:#eef0f2; --pill-ink:#0c0e10;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --info:#60a5fa;
  --car-glass:#5d7180; --tire:#050607; --hub:#7c8389; --car-edge:#4b535b;
  --shadow:none; --pop:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
a.lk{color:var(--green-strong);font-weight:600}
a.lk:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num,td.n{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:20px;height:20px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-block:26px 18px}
.side-in{padding-inline:20px;display:flex;flex-direction:column;gap:22px;flex:1}
.logo{display:flex;align-items:baseline;gap:2px;font-weight:800;font-size:26px;letter-spacing:-.03em;padding-inline:10px}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.nav{display:flex;flex-direction:column;gap:18px}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-g > span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 12px 8px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--surface-3);color:var(--ink);font-weight:700}
.nav a.on svg{color:var(--green-strong)}
.nav a em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:var(--pill);color:var(--pill-ink);border-radius:20px;padding:1px 8px}
.side-card{margin-top:auto;background:var(--green-soft);border:1px solid var(--green-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.side-card svg.car{width:100%;max-width:180px;height:auto;display:block;margin:0 auto}
.side-card b{font-size:13px}
.side-card p{font-size:12px;color:var(--ink-2)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;min-height:72px;padding-block:12px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.gsearch{position:relative;flex:0 1 340px;min-width:0}
.gsearch input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 12px 9px 38px}
.gsearch > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);padding:6px;z-index:40;max-height:70vh;overflow:auto;min-width:280px}
.pop .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.pop .it:hover,.pop .it:focus{background:var(--surface-2)}
.pop .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);position:relative}
.icon-btn:hover{border-color:var(--ink-2)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}
.me{position:relative}
.me > button{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:12px;text-align:left}
.me > button:hover{background:var(--surface-2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--green);color:var(--green-ink);flex:none}
.av.sm{width:30px;height:30px;font-size:11.5px}
.av.xs{width:24px;height:24px;font-size:10px}
.av.g{background:var(--surface-3);color:var(--ink-2)}
.me .nm b{display:block;font-size:14px;line-height:1.2}
.me .nm span{font-size:12.5px;color:var(--muted)}
.me .pop{left:auto;right:0;width:300px}
.content{padding-block:26px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ---------- page head ---------- */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.phead .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.phead .t p{color:var(--muted)}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a:hover{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.pri:hover{filter:brightness(.96)}
.btn.dark{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.xs{padding:3px 10px;font-size:12px}
.btn.lg{padding:12px 22px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button,.tabs a{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.tabs .on{color:var(--ink);border-bottom-color:var(--green)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button.on.ok{background:var(--green);color:var(--green-ink)}
.seg button.on.warn{background:var(--warn);color:#fff}
.seg button.on.bad{background:var(--bad);color:#fff}
.switch{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;font-weight:500}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:38px;height:22px;border-radius:20px;background:var(--surface-3);position:relative;transition:background .15s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked + i{background:var(--green)}
.switch input:checked + i::after{left:19px}
.switch input:focus-visible + i{outline:2px solid var(--green);outline-offset:2px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card > header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 0;flex-wrap:wrap}
.card > header .ht{display:flex;flex-direction:column;gap:2px;min-width:0}
.card > header .ht p{color:var(--muted);font-size:13px}
.card > .bd{padding:16px 20px 20px}
.card > .bd.flush{padding:8px 0 4px}
.card.pad{padding:18px 20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.g-dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr)}
.g-dash2{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr)}
.kpis{grid-column:span 2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.kpi .top{display:flex;align-items:center;gap:10px}
.kpi .ico{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink);flex:none}
.kpi .top .btn{margin-left:auto}
.kpi .lb{color:var(--ink-2);font-weight:500}
.kpi .vl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi .vl b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.trend{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.trend.up{color:var(--green-strong)}
.trend.down{color:var(--bad)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.stat-row.s5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat-row.s5 b{font-size:20px}
.stat b{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--green-soft);color:var(--green-strong)}
.chip.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.chip.info{background:color-mix(in srgb,var(--info) 13%,transparent);color:var(--info)}
.chip.dark{background:var(--pill);color:var(--pill-ink)}
.chip.line{background:transparent;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* ---------- plate + car ---------- */
.plate{display:inline-flex;flex-direction:column;border:1.5px solid #2b2f33;border-radius:4px;background:#fff;color:#111;overflow:hidden;line-height:1;flex:none}
.plate i{font-style:normal;background:var(--plate-band);color:#fff;font:700 6px/1 var(--font);letter-spacing:.22em;text-align:center;padding:2px 4px}
.plate span{font:800 13px/1 var(--font);letter-spacing:.08em;padding:3px 7px 2px;text-align:center}
.photo{position:relative;aspect-ratio:16/10;max-width:100%;background:radial-gradient(120% 90% at 50% 30%,var(--surface) 0%,var(--surface-2) 60%,var(--surface-3) 100%);overflow:hidden}
.photo::after{content:"";position:absolute;left:12%;right:12%;bottom:17%;height:10px;border-radius:50%;background:var(--ink);opacity:.08;filter:blur(3px)}
.photo svg.car{position:absolute;left:50%;bottom:19%;width:76%;transform:translateX(-50%);z-index:1}
.photo .tl{position:absolute;top:10px;left:10px;z-index:2}
.photo .tr{position:absolute;top:10px;right:10px;z-index:2}
.photo .bl{position:absolute;bottom:10px;left:10px;z-index:2;display:flex;gap:5px}
.thumb{width:64px;height:48px;border-radius:12px;overflow:hidden;flex:none;background:var(--surface-2);position:relative}
.thumb svg.car{position:absolute;left:8%;width:84%;bottom:18%}

/* ---------- vehicle grid ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:18px}
.vcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.vcard:hover{border-color:var(--green-line)}
.vcard .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.vcard h3{font-size:17px}
.vcard .ver{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price s{font-size:12px;font-weight:500;color:var(--muted);margin-right:5px}
.track{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.track i{height:5px;border-radius:3px;background:var(--surface-3)}
.track i.ok{background:var(--green)}
.track i.atencao{background:var(--warn)}

/* ---------- forms ---------- */
.inp,select.inp,textarea.inp{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;min-width:0;width:100%}
textarea.inp{resize:vertical}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .inp{width:auto}
.toolbar .search{flex:1 1 220px;max-width:360px;position:relative}
.toolbar .search .inp{width:100%;padding-left:36px;border-radius:999px}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.toolbar select.inp{border-radius:999px;padding-inline:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
label.f .inp{font-weight:400;font-size:14px;color:var(--ink)}
label.f small{font-weight:400;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
.form .wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--green);flex:none}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px}
.sec-t{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.sec-t p{color:var(--muted);font-size:13px;max-width:70ch}

/* ---------- esteira ---------- */
.esteira{display:grid;grid-template-columns:repeat(8,minmax(104px,1fr));overflow-x:auto;background:var(--surface);border:1px solid var(--card-line);border-radius:var(--r-lg);padding:6px;gap:4px}
.est{border:0;background:none;padding:10px 10px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;cursor:pointer;text-align:left;border-radius:12px;min-width:0}
.est:hover{background:var(--surface-2)}
.est.on{background:var(--surface-3)}
.est .n{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.est .l{font-weight:600;font-size:12.5px;line-height:1.25}
.est .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:11px;font-weight:700;color:var(--muted);background:var(--surface)}
.est.ok .dot{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.est.atencao .dot{background:var(--warn);border-color:var(--warn);color:#fff}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.late td{background:color-mix(in srgb,var(--bad) 5%,transparent)}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line)}
.tbl .sub{display:block;font-size:12px;color:var(--muted)}
.cardtbl{padding:6px 6px 8px}

/* ---------- lists / bars ---------- */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 18px}
.kv div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-weight:600}
.rows{display:flex;flex-direction:column}
.rows > .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rows > .row:last-child{border-bottom:0}
.hbars{display:flex;flex-direction:column;gap:16px}
.hbar{display:flex;flex-direction:column;gap:7px;color:inherit}
.hbar .t{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.hbar .t b{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.hbar .tr{height:9px;border-radius:9px;background:repeating-linear-gradient(-45deg,var(--surface-3) 0 4px,var(--surface-2) 4px 8px);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:9px;background:var(--pill)}

function etapa(v,k){
 switch(k){
  case 'avaliacao':return v.aval.done?'ok':'pendente';
  case 'precificacao':return v.venda>0?'ok':'pendente';
  case 'negEntrada':return v.negEntrada?'ok':'pendente';
  case 'pericia':return v.pericia.status==='aprovado'?'ok':v.pericia.status==='reprovado'?'atencao':'pendente';
  case 'recebimento':{const s=REC.map(([r])=>v.receb[r]);return s.every(x=>x!=='pendente')?'ok':s.some(x=>x!=='pendente')?'atencao':'pendente'}
  case 'servicos':{if(!v.aval.done)return 'pendente';if(v.servicos.every(s=>s.feito))return 'ok';return v.servicos.some(s=>s.feito||s.st==='fazendo')?'atencao':'pendente'}
  case 'anuncios':{const c=pubCount(v),t=portaisAtivos().length;return v.status==='vendido'?'ok':c>=t-1?'ok':c>0?'atencao':'pendente'}
  case 'negSaida':{const a=negAberta(v.id);return v.status==='vendido'?'ok':(a&&a.saidaId===v.id)?'atencao':'pendente'}
 }
}
function pendencias(v){
 if(v.status!=='estoque')return [];
 const p=[];
 if(!v.aval.done)p.push('avaliacao');
 else{
  if(!(v.venda>0))p.push('precificacao');
  if(!v.negEntrada)p.push('negociacao');
  if(v.pericia.status!=='aprovado')p.push('pericia');
  REC.forEach(([k])=>{if(v.receb[k]==='pendente')p.push(k)});
  if(v.servicos.some(s=>!s.feito))p.push('servico');
  if(v.fotos<(+CFG().loja.kmMinFotos||8))p.push('foto');
  if(!pubCount(v))p.push('anuncio');
 }
 if(negAberta(v.id))p.push('proposta');
 return p;
}
function statusChip(v){
 if(v.status==='vendido')return chip('Vendido','ok dot');
 if(v.status==='devolvido')return chip('Devolvido','bad dot');
 const p=pendencias(v);
 if(p.includes('avaliacao'))return chip('Avaliação pendente','warn dot');
 if(p.includes('precificacao'))return chip('Precificação pendente','warn dot');
 if(p.includes('negociacao'))return chip('Negociação pendente','warn dot');
 if(p.includes('proposta'))return chip('Proposta em andamento','info dot');
 if(pubCount(v))return chip(v.estoque==='atacado'?'No atacado':'Anunciado','ok dot');
 return chip('Em preparação','dot');
}
function negCalc(n){
 const saida=n.saidaId?(+n.valorSaida||0):0;
 const ent=n.entradas.reduce((a,e)=>a+(+e.valor||0),0);
 const deb=n.debitos.reduce((a,d)=>a+(+d.valor||0),0);
 const total=saida-ent+deb-(+n.desconto||0);
 const pago=n.pagamentos.reduce((a,p)=>a+(+p.valor||0),0);
 return {saida,ent,deb,total,pago,falta:Math.round((Math.abs(total)-pago)*100)/100};
}

 const L=CFG().contas.filter(c=>c.ativo&&c.tipo===(tipo==='R'?'R':'D'));
 const c=L.find(c=>c.formas.includes(forma));
 return (c||L.find(c=>c.nome===(tipo==='R'?'Receita com venda':'Custo com compra'))||L[0]||{}).id;
}

 vals(S.neg).forEach(n=>{if(!['pendente-contrato','finalizada'].includes(n.status))return;n.pagamentos.forEach(p=>{if(p.forma==='Adiantamento')u.push({tipo:'cliente',pessoa:n.clienteId,data:p.data||n.criado,valor:-(+p.valor||0),desc:`Usado na negociação #${n.id}`,conta:null,neg:n.id})})});
 return u;
}

/* retornos de financiamento: um por pagamento financiado (negociação ou intermediação) */
function retornos(){
 const out=[];
 vals(S.neg).forEach(n=>{if(n.status==='cancelada')return;n.pagamentos.forEach((p,i)=>{if(p.forma!=='Financiamento')return;const k=`n${n.id}p${i}`;out.push(Object.assign({key:k,origem:'neg',ref:n.id,cliente:cliNome(n.clienteId),vendedor:n.vendedor,placa:S.veh[n.saidaId]?.placa||'',veic:nome(S.veh[n.saidaId]),banco:p.banco||'',financiado:+p.valor||0,base:p.data||n.criado,ativo:n.status!=='rascunho'},retInfo(k,p.banco)))})});
 vals(S.inter).forEach(x=>{if(x.status==='cancelada')return;x.pagamentos.forEach((p,i)=>{if(p.forma!=='Financiamento')return;const k=`i${x.id}p${i}`;out.push(Object.assign({key:k,origem:'int',ref:x.id,cliente:cliNome(x.comprador),vendedor:x.vendedorLoja,placa:x.veic.placa,veic:x.veic.marca+' '+x.veic.modelo,banco:p.banco||'',financiado:+p.valor||0,base:p.data||x.criado,ativo:['aprovacao','pendente-contrato','finalizada'].includes(x.status)},retInfo(k,p.banco)))})});
 return out.sort((a,b)=>b.base.localeCompare(a.base));
}
function retInfo(k,banco){
 const r=S.fin.retornos[k]||{};
 const pctPadrao=(CFG().bancos.find(b=>b.cod===banco)||{}).pct||0;
 const o={dataAprov:r.dataAprov||'',pct:r.pct??pctPadrao,valor:r.valor,plus:+r.plus||0,prest:!!r.prest,prestValor:+r.prestValor||0,status:r.status||(r.dataAprov?'aberto':'aguardando'),liq:r.liq||''};
 return o;
}
const retValor=r=>r.valor!=null&&r.valor!==''?+r.valor:Math.round(r.financiado*(+r.pct||0))/100;
const retTotal=r=>retValor(r)+r.plus+(r.prest?r.prestValor:0);
/* intermediação */
function intCalc(x){
 const deb=x.debitos.reduce((a,d)=>a+(+d.valor||0),0);
 const serv=x.servicos.reduce((a,s)=>a+(+s.receita||0),0);
 const total=(+x.valor||0)+deb+serv+(x.taxaQuem==='Comprador'?(+x.taxa||0):0);
 const pago=x.pagamentos.reduce((a,p)=>a+(+p.valor||0),0);
 return {deb,serv,total,pago,falta:Math.round((total-pago)*100)/100,lucro:(+x.taxa||0)+x.servicos.reduce((a,s)=>a+(+s.receita||0)-(+s.despesa||0),0)};
}
function titulos(){
 const out=[];const add=t=>out.push(t);
 vals(S.neg).forEach(n=>{
  if(!['pendente-contrato','finalizada'].includes(n.status))return;
  const vs=S.veh[n.saidaId]||S.veh[n.entradas[0]?.vid];
  n.pagamentos.forEach((p,i)=>{
   if(p.forma==='Adiantamento')return;
   const tipo=p.quem==='Loja'?'P':'R';
   add({key:`n${n.id}p${i}`,tipo,venc:p.data||n.criado,pessoa:p.quem==='Banco'?bancoNome(p.banco):cliNome(n.clienteId),desc:`Negociação #${n.id} · ${NEG_TIPOS[n.tipo]} · ${p.forma}${vs?' · '+nome(vs):''}`,conta:contaPara(p.forma,tipo),valor:+p.valor||0,origem:'neg',ref:n.id});
  });
 });
 vehList().forEach(v=>v.servicos.forEach((s,i)=>{
  if(!s.feito||!(+s.real))return;
  add({key:`s${v.id}_${i}`,tipo:'P',venc:s.prevPag||s.data||v.entrada,pessoa:s.f?fornNome(s.f):'Fornecedor não informado',desc:`OS ${s.os||'—'} · ${s.n} · ${nome(v)} ${v.placa||''}`,conta:contaPorNome('Custo com manutenção - Preparação'),valor:+s.real,origem:'serv',ref:v.id});
 }));
 S.agreg.forEach(g=>{
  const v=S.veh[g.vid];const c=CFG().custos.find(x=>x.id===g.custo);
  if(+g.despesa)add({key:`ag${g.id}d`,tipo:'P',venc:g.venc,pessoa:fornNome(g.forn),desc:`${g.tipo} · ${g.desc}${v?' · '+nome(v)+' '+(v.placa||''):''}`,conta:(c&&c.conta)||contaPorNome(g.tipo==='Documento'?'Custo com documentação':'Custo com manutenção - Preparação'),valor:+g.despesa,origem:'agreg',ref:g.id});
  if(+g.receita)add({key:`ag${g.id}r`,tipo:'R',venc:g.venc,pessoa:g.cliente?cliNome(g.cliente):'Cliente',desc:`${g.tipo} · ${g.desc}${v?' · '+nome(v):''}`,conta:contaPorNome(g.tipo==='Documento'?'Receita com venda de documentos':'Receita com venda de serviços agregados'),valor:+g.receita,origem:'agreg',ref:g.id});
 });
 vals(S.inter).forEach(x=>{
  if(!['pendente-contrato','finalizada'].includes(x.status))return;
  const quem=x.taxaQuem==='Vendedor'?x.vendedor:x.comprador;
  if(+x.taxa)add({key:`im${x.id}`,tipo:'R',venc:x.pagamentos[0]?.data||x.criado,pessoa:cliNome(quem),desc:`Intermediação #${x.id} · taxa · ${x.veic.marca} ${x.veic.modelo}`,conta:contaPorNome('Receita com taxa de intermediação de financiamento'),valor:+x.taxa,origem:'int',ref:x.id});
  x.servicos.forEach((sv,i)=>{
   if(+sv.receita)add({key:`im${x.id}s${i}r`,tipo:'R',venc:x.criado,pessoa:cliNome(x.comprador),desc:`Intermediação #${x.id} · ${sv.desc}`,conta:contaPorNome('Receita com venda de serviços agregados'),valor:+sv.receita,origem:'int',ref:x.id});
   if(+sv.despesa)add({key:`im${x.id}s${i}d`,tipo:'P',venc:x.criado,pessoa:fornNome(sv.forn),desc:`Intermediação #${x.id} · ${sv.desc}`,conta:contaPorNome('Custo com documentação'),valor:+sv.despesa,origem:'int',ref:x.id});
  });
 });
 retornos().forEach(r=>{
  if(!r.ativo||r.status==='aguardando')return;
  const tot=retTotal(r);if(!tot)return;
  add({key:'ret-'+r.key,tipo:'R',venc:addMonths(r.dataAprov||r.base,1),pessoa:bancoNome(r.banco),desc:`Retorno de financiamento · ${r.origem==='neg'?'Negociação':'Intermediação'} #${r.ref} · ${r.cliente}`,conta:contaPorNome('Receita com venda - Retorno de financiamento'),valor:tot,origem:'ret',ref:r.key});
 });
 S.consultas.forEach(c=>{if(c.status==='erro'||!+c.custo)return;add({key:'cv'+c.id,tipo:'P',venc:c.data,pessoa:CFG().consulta.prov,desc:`Consulta veicular · ${(CONS_TIPOS.find(t=>t[0]===c.tipo)||[])[1]||c.tipo} · ${c.placa}`,conta:contaPorNome('Custo com consulta veicular'),valor:+c.custo,origem:'cons',ref:c.id})});
 S.fin.titulos.forEach(t=>{const c=contaById(t.conta);add({key:'t'+t.id,tipo:c&&c.tipo==='R'?'R':'P',venc:t.venc,pessoa:t.pessoa,desc:t.desc+(t.serie?' · recorrente':''),conta:t.conta,valor:+t.valor||0,origem:'manual',ref:t.id,serie:t.serie})});
 out.forEach(t=>{const b=baixa(t.key);t.pago=b?b.d:'';t.contaBanc=b?b.conta:null;t.vencido=!t.pago&&t.venc<TODAY_ISO});
 return out.sort((a,b)=>a.venc.localeCompare(b.venc));
}

function movimentos(contaId){
 const M=[];
 titulos().forEach(t=>{if(t.pago&&+t.contaBanc===+contaId)M.push({d:t.pago,desc:t.desc,pessoa:t.pessoa,valor:t.tipo==='R'?t.valor:-t.valor,orig:'Título'})});
 S.fin.adiant.forEach(m=>{if(+m.conta===+contaId)M.push({d:m.data,desc:(m.tipo==='cliente'?'Adiantamento de cliente':'Adiantamento a fornecedor')+' · '+m.desc,pessoa:pessoaAdiant(m.tipo,m.pessoa),valor:m.tipo==='cliente'?m.valor:-m.valor,orig:'Adiantamento'})});
 return M.sort((a,b)=>a.d.localeCompare(b.d));
}
const saldoConta=(id,ate)=>{const c=CFG().contasBanc.find(x=>x.id===+id);return (c?+c.saldoIni:0)+movimentos(id).filter(m=>!ate||m.d<=ate).reduce((a,m)=>a+m.valor,0)};
/* consulta veicular simulada (determinística pela placa) */
function consultaResultado(placa,tipo){
 let h=0;String(placa||'').split('').forEach(c=>h=(h*31+c.charCodeAt(0))%9973);
 const R=[];
 const ok=(t,v)=>R.push([t,v,true]), al=(t,v)=>R.push([t,v,false]);
 if(['basica','completa'].includes(tipo)){ok('Situação do veículo','Em circulação');(h%5===0?al:ok)('Restrição administrativa',h%5===0?'Consta bloqueio por débito':'Nada consta');(h%4===1?al:ok)('Gravame / alienação',h%4===1?'Alienação fiduciária ativa':'Nada consta')}
 if(tipo==='completa'){(h%3===0?al:ok)('Débitos de IPVA e licenciamento',h%3===0?'R$ '+(800+h%900)+',00 em aberto':'Nada consta');(h%7===2?al:ok)('Multas',h%7===2?'2 multas em aberto':'Nada consta');ok('Recall',h%6===3?'1 campanha pendente':'Nenhuma campanha pendente')}
 if(tipo==='leilao'){(h%6===4?al:ok)('Passagem por leilão',h%6===4?'Consta 1 registro':'Nada consta');ok('Sinistro / perda total','Nada consta');ok('Indício de sinistro','Nada consta')}
 if(tipo==='roubo')ok('Registro de roubo ou furto','Nada consta');
 if(tipo==='proprietarios')ok('Quantidade de proprietários',String(1+h%4));
 return R;
}

function quadroPara(origem){
 const s=slug(origem);const Q=CFG().quadros.filter(q=>q.ativo);
 return Q.find(q=>q.origens.includes(s))||Q.find(q=>q.padrao)||Q[0];
}
function proximoDaFila(q,avancar){
 if(!q)return null;
 const m=q.equipe.filter(e=>e.fila&&CFG().usuarios[e.uid]&&CFG().usuarios[e.uid].status==='ativo');
 if(!m.length)return null;
 const e=m[(q.ptr||0)%m.length];
 if(avancar)q.ptr=((q.ptr||0)+1)%m.length;
 return e.uid;
}

/* ---------- gráfico de linhas (valor de estoque x custo) ---------- */
function serieEstoque(semanas=10){
 const pts=[];
 for(let w=semanas-1;w>=0;w--){
  const d=dAgo(w*7);
  let venda=0,custo=0,n=0;
  vehList().forEach(v=>{if(v.entrada<=d&&(!v.saida||v.saida>d)&&v.venda>0){venda+=preco(v);custo+=v.compra+gastoPrev(v);n++}});
  pts.push({d,venda,custo,n});
 }
 return pts;
}
function lineChart(pts){
 const W=460,H=250,L=58,R=12,T=14,B=30;
 const max=Math.max(...pts.map(p=>p.venda))*1.08||1, min=Math.min(...pts.map(p=>p.custo))*0.92;
 const x=i=>L+i*(W-L-R)/(pts.length-1), y=v=>T+(H-T-B)*(1-(v-min)/(max-min||1));
 const ticks=4, tv=[...Array(ticks+1)].map((_,i)=>min+(max-min)*i/ticks);
 const path=k=>pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p[k]).toFixed(1)}`).join(' ');
 const last=pts.length-1;
 return `<div class="chart" data-chart="estoque"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Valor de estoque e custo nas últimas ${pts.length} semanas">
  ${tv.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="4 5"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12.5" fill="var(--muted)" font-family="var(--font)">${brlK(v).replace('R$ ','')}</text>`).join('')}
  ${pts.map((p,i)=>i%2===last%2?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12.5" fill="var(--muted)" font-family="var(--font)">${p.d.slice(8)}/${p.d.slice(5,7)}</text>`:'').join('')}
  <path d="${path('custo')}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 5"/>
  <path d="${path('venda')}" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.venda)}" r="${i===last?6:4.2}" fill="${i===last?'var(--green)':'var(--surface)'}" stroke="var(--ink)" stroke-width="2"/>`).join('')}
  <line class="hl" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink-2)" stroke-width="1" opacity="0"/>
  ${pts.map((p,i)=>`<rect x="${x(i)-(W-L-R)/(pts.length-1)/2}" y="${T}" width="${(W-L-R)/(pts.length-1)}" height="${H-T-B}" fill="transparent" data-i="${i}" data-x="${x(i)}" data-y="${y(p.venda)}"/>`).join('')}
 </svg><div class="tip" hidden></div></div>`;
}

function viewVeiculos(){
 const f=UI.vf; const q=f.q.trim().toLowerCase();
 let L=vehList().filter(v=>{
  if(f.status&&v.status!==f.status)return false;
  if(f.estoque&&v.estoque!==f.estoque)return false;
  if(f.neg&&v.neg!==f.neg)return false;
  if(f.veic==='zero'&&!v.zeroKm)return false;
  if(f.veic==='usado'&&v.zeroKm)return false;
  if(f.pend&&!pendencias(v).includes(f.pend))return false;
  if(q&&!(`${v.placa} ${v.marca} ${v.modelo} ${v.versao} ${v.cor} ${v.anoMod}`.toLowerCase().includes(q)))return false;
  return true;});
 const sorts={recentes:(a,b)=>b.entrada.localeCompare(a.entrada),antigos:(a,b)=>a.entrada.localeCompare(b.entrada),maior:(a,b)=>preco(b)-preco(a),menor:(a,b)=>preco(a)-preco(b),km:(a,b)=>a.km-b.km,pend:(a,b)=>pendencias(b).length-pendencias(a).length};
 L.sort(sorts[f.sort]||sorts.recentes);
 const fs=(k,list,lab)=>`<select class="inp" id="vf-${k}" data-ui="vf.${k}" aria-label="${lab}">${opts(list,f[k])}</select>`;
 return phead('Veículos',`${L.length} ${L.length===1?'veículo':'veículos'} com os filtros atuais`,can('avaliacoes')?`<button class="btn pri" type="button" data-act="novaAval">${ic('plus','sm')} Nova avaliação</button>`:'')+`
 <div class="toolbar">
  <span class="search">${ic('search','sm')}<input class="inp" id="vf-q" type="search" placeholder="Buscar placa, marca, modelo…" value="${esc(f.q)}" data-ui="vf.q" data-live="1"></span>
  ${fs('status',[['','Todos os status'],['estoque','Em estoque'],['vendido','Vendidos'],['devolvido','Devolvidos']],'Status')}
  ${fs('estoque',[['','Showroom e atacado'],['showroom','Showroom'],['atacado','Atacado']],'Estoque')}
  ${fs('neg',[['','Próprio e consignado'],['proprio','Próprio'],['consignado','Consignado']],'Negociação')}
  ${fs('veic',[['','Zero km e usados'],['zero','Zero km'],['usado','Usados']],'Veículo')}
  ${fs('pend',[['','Qualquer pendência']].concat(Object.entries(PEND)),'Pendência')}
  ${fs('sort',[['recentes','Entrada mais recente'],['antigos','Mais tempo no pátio'],['maior','Maior preço'],['menor','Menor preço'],['km','Menor quilometragem'],['pend','Mais pendências']],'Ordenar')}
  ${(f.q||f.estoque||f.neg||f.pend||f.veic||f.status!=='estoque')?`<button class="btn ghost sm" type="button" data-act="vclear">Limpar filtros</button>`:''}
 </div>

}

function viewAval(id){

 const areaDone=a=>a.itens.every(it=>v.aval.itens[a.k+'|'+it]);
 const doneStep=i=>i===0?!!v.km:i>=1&&i<=6?areaDone(AREAS[i-1]):i===7?Object.keys(v.aval.serv).length>0:v.aval.done;
 let body='';
 if(st===0){
  const VP='veh.'+id+'.';
  body=`<section class="card"><header><h3>Dados do veículo</h3>${plate(v)}</header><div class="bd" style="display:flex;flex-direction:column;gap:18px">

   <div class="form"><label class="f">Portas${segm(VP+'portas',[2,3,4],v.portas,{num:true})}</label><label class="f">Rodas${segm(P+'rodas',['Liga leve','Ferro'],v.aval.rodas)}</label><label class="f">Tem chave reserva?${segm(P+'chaveReserva',[['true','Sim'],['false','Não']],String(v.aval.chaveReserva))}</label></div>
   <div><span class="eyebrow">Opcionais</span><div class="checks" style="margin-top:10px">${OPCIONAIS.map(o=>`<label class="check"><input type="checkbox" id="aop-${id}-${fid(o)}" data-act-change="opc" data-id="${id}" data-o="${esc(o)}" ${v.opcionais.includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div></div>
  </div></section>`;
 } else if(st>=1&&st<=6){
  const a=AREAS[st-1];
  const marcados=a.itens.filter(it=>v.aval.itens[a.k+'|'+it]).length;
  body=`${a.fotos.length?`<section class="card"><header><div class="ht"><h3>Fotos · ${a.n}</h3><p>Toque para registrar</p></div></header><div class="bd shots">${a.fotos.map(f=>{const ok=v.aval.fotos[a.k+'|'+f];return `<button type="button" class="shot ${ok?'ok':''}" data-act="avalFoto" data-id="${id}" data-k="${esc(a.k+'|'+f)}">${ok?ic('check','lg'):ic('plus','lg')}${esc(f)}<span class="small" style="font-weight:500">${ok?'Foto registrada':'Adicionar foto'}</span></button>`}).join('')}</div></section>`:''}
  ${a.k==='testdrive'?`<section class="card pad"><label class="f">Realizou test-drive no veículo?${segm(P+'testDrive',[['true','Sim'],['false','Não']],String(v.aval.testDrive))}</label></section>`:''}
  <section class="card"><header><h3>Itens da avaliação</h3><span class="chips">${chip(marcados+'/'+a.itens.length+' avaliados',marcados===a.itens.length?'ok':'')}<button class="btn xs" type="button" data-act="avalTodosOk" data-id="${id}" data-a="${a.k}">Marcar restantes como OK</button></span></header><div class="bd">
   ${a.itens.map(it=>{const k=a.k+'|'+it, o=v.aval.itens[k]||{};return `<div class="item"><span class="nm">${esc(it)}</span><span class="ctl"><div class="seg"><button type="button" class="${o.s==='ok'?'on ok':''}" data-act="avalItem" data-id="${id}" data-k="${esc(k)}" data-s="ok">OK</button><button type="button" class="${o.s==='reparo'?'on warn':''}" data-act="avalItem" data-id="${id}" data-k="${esc(k)}" data-s="reparo">Reparo</button></div>${o.s==='reparo'?`<input class="inp cost" type="number" step="any" id="${fid('cost-'+id+'-'+k)}" data-cost="${esc(k)}" data-id="${id}" value="${o.v||''}" placeholder="R$ previsto" aria-label="Valor previsto do reparo">`:''}</span></div>`}).join('')}
  </div></section>`;
 } else if(st===7){
  const cat=custosRef('Preparação');
  body=`<section class="card"><header><div class="ht"><h3>Serviços de preparação</h3><p>Lista vem do catálogo de custos (referente Preparação). Valores sugeridos são o custo padrão.</p></div></header><div class="bd">${cat.map(c=>{const n=c.nome;return `<div class="item"><span class="nm">${esc(n)}${c.valor?` <span class="small muted">padrão ${brl(c.valor)}</span>`:''}</span><input class="inp cost" type="number" step="any" id="${fid('srv-'+id+'-'+n)}" data-srv="${esc(n)}" data-id="${id}" value="${v.aval.serv[n]||''}" placeholder="R$ 0" aria-label="Previsão para ${esc(n)}"></div>`}).join('')||'<div class="empty">Nenhum custo de preparação ativo.</div>'}</div></section>`;
 } else {
  const faltam=AREAS.filter(a=>!areaDone(a)).map(a=>a.n);
  const AV=avaliadores();
  body=`<section class="card"><header><h3>Revise a avaliação</h3></header><div class="bd" style="display:flex;flex-direction:column;gap:16px">
   ${faltam.length?`<div class="note warn">Áreas com itens sem marcação: <b>${faltam.join(', ')}</b>. Você pode finalizar assim mesmo; itens sem marcação contam como OK.</div>`:''}
   ${avalResumoTbl(v)}
   <div class="form"><label class="f">Avaliador${sel(P+'avaliador',AV.includes(v.aval.avaliador)?AV:[v.aval.avaliador].concat(AV),v.aval.avaliador)}</label><label class="f wide">Feedback do avaliador${inp(P+'feedback',v.aval.feedback,{ph:'Ex.: carro bem conservado, pneus dianteiros no limite'})}</label></div>
  </div></section>`;
 }
 return phead(esc(nome(v)),'Avaliação · '+esc(v.versao),v.aval.done?chip('Avaliação finalizada','ok dot'):'',`<a href="#veiculos">Veículos</a>${ic('right','sm')}<a href="#v-${id}">${esc(v.placa||'Zero km')}</a>${ic('right','sm')}<span>Avaliação</span>`)+`
 <div class="steps">${AVAL_STEPS.map((s,i)=>`<button type="button" class="${i===st?'on':''} ${doneStep(i)&&i!==st?'done':''}" data-act="avalStep" data-id="${id}" data-st="${i}"><i>${doneStep(i)&&i!==st?'✓':i+1}</i>${s}</button>`).join('')}</div>
 <div class="wiz">${body}
 <div class="wiz-ft"><button class="btn" type="button" data-act="avalStep" data-id="${id}" data-st="${st-1}" ${st===0?'disabled':''}>Voltar</button>${st<8?`<button class="btn pri" type="button" data-act="avalStep" data-id="${id}" data-st="${st+1}">Avançar</button>`:`<button class="btn pri" type="button" data-act="avalFinal" data-id="${id}">${v.aval.done?'Salvar alterações':'Finalizar avaliação'}</button>`}</div></div>`;
}

function viewNegociacoes(){
 const f=UI.nf, q=f.q.trim().toLowerCase();
 let L=vals(S.neg).filter(n=>(!f.tipo||n.tipo===f.tipo)&&(!f.status||n.status===f.status)&&(!q||`#${n.id} ${cliNome(n.clienteId)} ${nome(S.veh[n.saidaId])} ${n.entradas.map(e=>nome(S.veh[e.vid])).join(' ')}`.toLowerCase().includes(q))).sort((a,b)=>b.id-a.id);
 const vm=id=>{const v=S.veh[id];return v?`<span style="display:flex;gap:10px;align-items:center">${thumb(v)}<span><b>${esc(nome(v))}</b><span class="sub">${esc(v.placa||'Zero km')} · ${v.anoMod}</span></span></span>`:''};
 return phead('Negociações',`${L.length} negociações`,`<button class="btn pri" type="button" data-act="novaNeg">${ic('plus','sm')} Nova negociação</button>`)+`

 <td>${n.entradas.length?n.entradas.map(e=>vm(e.vid)).join(''):'<span class="muted">—</span>'}</td>
 <td>${n.saidaId?vm(n.saidaId):'<span class="muted">—</span>'}</td>
 <td class="n"><b>${brl(Math.abs(c.total))}</b><span class="sub">${c.total>=0?'cliente paga':'loja paga'}</span></td>
 <td class="small">${n.hist.slice(0,1).map(h=>`${esc(h.a)} em ${dtf(h.d)}<span class="sub">${esc(h.q)}</span>`).join('')}</td>
 <td><a class="btn xs dark" href="#neg-${n.id}">Ver</a></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nenhuma negociação.</td></tr>'}
 </tbody></table></div></section>`;
}

function contratoTexto(n,k){
 const cl=S.cli[n.clienteId]||{nome:'[CLIENTE]',doc:'[CPF]',cidade:'[CIDADE]',tel:''};
 const L=CFG().loja, c=negCalc(n), hoje=TODAY.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
 const vd=v=>v?`${v.marca} ${v.modelo} ${v.versao}, ano ${v.anoFab}/${v.anoMod}, cor ${v.cor.toLowerCase()}, placa ${v.placa||'(zero km)'}, Renavam ${v.renavam||'—'}, ${numf(v.km)} km`:'[VEÍCULO]';
 const sv=S.veh[n.saidaId], ev=n.entradas.map(e=>S.veh[e.vid]);
 const pags=n.pagamentos.map(p=>`  • ${p.forma}: ${brl2(p.valor)}, com vencimento em ${dtf(p.data)} (${p.quem.toLowerCase()} paga)`).join('\n')||'  • A definir';
 const ass=`\n\n${L.cidade.split('-')[0]}, ${hoje}.\n\n\n_______________________________          _______________________________\n${L.nome}                                ${cl.nome}`;
 const partes=`LOJA: ${L.nome}, CNPJ ${L.cnpj}, com sede em ${L.endereco}, ${L.cidade}.\nCLIENTE: ${cl.nome}, CPF ${cl.doc}, residente em ${cl.cidade}.`;
 switch(k){
  case 'compra-venda':return `CONTRATO PARTICULAR DE COMPRA E VENDA DE VEÍCULO\nNegociação nº ${n.id} · ${NEG_TIPOS[n.tipo]}\n\n${partes}\n\nCLÁUSULA 1ª · OBJETO\n${sv?'A LOJA vende ao CLIENTE o veículo '+vd(sv)+', pelo valor de '+brl2(c.saida)+'.':''}${ev.length?'\n'+(n.tipo==='compra'?'O CLIENTE vende à LOJA':'O CLIENTE entrega à LOJA, como parte do pagamento,')+' o(s) veículo(s): '+ev.map((v,i)=>vd(v)+' ('+brl2(n.entradas[i].valor)+')').join('; ')+'.':''}\n\nCLÁUSULA 2ª · PREÇO E PAGAMENTO\nSaldo da operação: ${brl2(Math.abs(c.total))}, ${c.total>=0?'a ser pago pelo CLIENTE':'a ser pago pela LOJA'}, da seguinte forma:\n${pags}\n\nCLÁUSULA 3ª · ESTADO DO VEÍCULO\nO comprador declara ter vistoriado o veículo e recebê-lo no estado em que se encontra${sv&&sv.garantia!=='Sem garantia'?', com garantia de '+sv.garantia+' para motor e câmbio':''}.\n\nCLÁUSULA 4ª · TRANSFERÊNCIA\nA transferência de propriedade junto ao DETRAN deverá ser feita em até 30 dias, sob responsabilidade do comprador.\n\nCLÁUSULA 5ª · FORO\nFica eleito o foro da comarca de ${L.cidade}.${ass}`;
  case 'procuracao-venda':return `PROCURAÇÃO PARA VENDA DE VEÍCULO\n\nOUTORGANTE: ${L.nome}, CNPJ ${L.cnpj}.\nOUTORGADO: ${cl.nome}, CPF ${cl.doc}.\n\nPoderes para representar o outorgante perante o DETRAN e demais órgãos, assinar o documento de transferência e praticar todos os atos necessários à transferência do veículo ${vd(sv)}.${ass}`;
  case 'procuracao-condutor':return `PROCURAÇÃO PARA APRESENTAÇÃO DE CONDUTOR INFRATOR\n\nOUTORGANTE: ${L.nome}, CNPJ ${L.cnpj}.\nOUTORGADO: ${cl.nome}, CPF ${cl.doc}.\n\nPoderes para indicar o condutor responsável por infrações de trânsito cometidas com o veículo ${vd(sv)} a partir da data de entrega, até a conclusão da transferência.${ass}`;
  case 'procuracao-compra':return `PROCURAÇÃO PARA COMPRA DE VEÍCULO\n\nOUTORGANTE: ${cl.nome}, CPF ${cl.doc}.\nOUTORGADO: ${L.nome}, CNPJ ${L.cnpj}.\n\nPoderes para vender, transferir e dar quitação do veículo ${vd(ev[0])}, podendo assinar o documento de transferência em nome do outorgante.${ass}`;
  case 'termo-entrega':return `TERMO DE ENTREGA E RESPONSABILIDADE\n\nDeclaro ter recebido de ${L.nome} o veículo ${vd(sv)}${n.agenda.entrega?', em '+dtf(n.agenda.entrega)+' às '+n.agenda.hEntrega:''}.\nA partir desta data assumo total responsabilidade civil e criminal pelo veículo, inclusive multas e infrações, até a efetiva transferência.${ass}`;
  case 'termo-recebimento':return `TERMO DE RECEBIMENTO E RESPONSABILIDADE\n\n${L.nome} declara ter recebido de ${cl.nome} o(s) veículo(s): ${ev.map(vd).join('; ')}${n.agenda.receb?', em '+dtf(n.agenda.receb)+' às '+n.agenda.hReceb:''}.\nO proprietário anterior responde por débitos, multas e infrações anteriores a esta data.${ass}`;
  case 'consignacao':return `CONTRATO DE CONSIGNAÇÃO DE VEÍCULO\n\n${partes.replace('LOJA:','CONSIGNATÁRIA:').replace('CLIENTE:','CONSIGNANTE:')}\n\nO CONSIGNANTE entrega à CONSIGNATÁRIA, para venda, o veículo ${vd(ev[0])}.\nValor líquido de repasse ao CONSIGNANTE: ${brl2(n.entradas[0]?.valor)}, a ser pago em até 5 dias úteis após a venda.\nPrazo de consignação: 90 dias, renováveis. Despesas de preparação previamente aprovadas serão descontadas do repasse.${ass}`;
  case 'residencia':return `DECLARAÇÃO DE RESIDÊNCIA\n\nEu, ${cl.nome}, CPF ${cl.doc}, declaro para os devidos fins que resido em ${cl.cidade}.\nDeclaro ainda estar ciente de que a falsidade desta declaração configura crime previsto no Código Penal.${ass}`;
 }
}

 if(k==='servicos'){return {h:['Fornecedor','Especialidade','Serviços','Concluídos','Previsto','Realizado'],r:vals(S.forn).map(f=>{const ss=vehList().flatMap(v=>v.servicos.filter(s=>+s.f===f.id));return [f.nome,f.tipo,ss.length,ss.filter(s=>s.feito).length,brl(ss.reduce((a,s)=>a+s.prev,0)),brl(ss.filter(s=>s.feito).reduce((a,s)=>a+(+s.real||0),0))]})}}

function route(){

function setPath(path,val){const ks=path.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function readVal(t){if(t.type==='checkbox')return t.checked;if(t.dataset.type==='num')return t.value===''?0:+t.value;if(t.value==='true')return true;if(t.value==='false')return false;return t.value}
function setUI(path,val){const ks=path.split('.');let o=UI;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function afterSet(path){
 const ks=path.split('.');
 if(ks[0]==='neg'&&ks[2]==='tipo'){const n=S.neg[ks[1]];if(n.tipo==='venda')n.entradas=[];if(['compra','consignacao'].includes(n.tipo)){n.saidaId=null;n.valorSaida=0}}
 if(ks[0]==='cfg'&&ks[1]==='quadros'&&ks[3]==='ativo'&&!CFG().quadros.some(q=>q.ativo)){CFG().quadros[+ks[2]].ativo=true;toast('Mantenha ao menos um quadro ativo')}
}
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='m-perfil'){const d=document.getElementById('m-perfil-desc');if(d)d.textContent=perfil(t.value).desc||'';return}
 if(t.dataset.set){setPath(t.dataset.set,readVal(t));afterSet(t.dataset.set);save();render();return}
 if(t.dataset.ui&&!t.dataset.live){setUI(t.dataset.ui,readVal(t));render();return}
 if(t.dataset.cost){S.veh[t.dataset.id].aval.itens[t.dataset.cost].v=+t.value||0;save();return}
 if(t.dataset.srv){S.veh[t.dataset.id].aval.serv[t.dataset.srv]=+t.value||0;save();return}
 const ac=t.dataset.actChange; if(!ac)return;
 const CH={
  opc(){const v=S.veh[t.dataset.id];const o=t.dataset.o;v.opcionais=t.checked?[...new Set(v.opcionais.concat(o))]:v.opcionais.filter(x=>x!==o)},
  dest(){const id=+t.dataset.id;let d=S.site.dest.filter(x=>x!==id);if(t.checked){if(d.length>=6){t.checked=false;toast('Limite de 6 destaques atingido');return}d.push(id)}S.site.dest=d},
  negSaidaSel(){const n=S.neg[t.dataset.id];n.saidaId=t.value?+t.value:null;n.valorSaida=n.saidaId?preco(S.veh[n.saidaId]):0},
  negAddEnt(){if(!t.value)return;const n=S.neg[t.dataset.id];const v=S.veh[+t.value];n.entradas.push({vid:v.id,valor:v.compra||v.fipe||0})},
  negAddDeb(){if(!t.value)return;const c=CFG().custos.find(x=>x.id===+t.value);S.neg[t.dataset.id].debitos.push({desc:c.nome,valor:c.valor||0})},
  addServCat(){if(!t.value)return;const c=CFG().custos.find(x=>x.id===+t.value);S.veh[t.dataset.id].servicos.push({n:c.nome,orig:c.ref,f:c.forn,prev:c.valor||0,real:0,feito:false,st:'afazer',data:''});toast(c.nome+' adicionado')},
  servSt(){setServSt(S.veh[t.dataset.id].servicos[+t.dataset.i],t.value)},
  leadSt(){const l=S.lead[t.dataset.id];if(t.value==='insucesso')return modalMotivo(l.id);if(['agendado','visita'].includes(t.value))return modalAgenda(l.id,t.value);l.status=t.value;l.motivo='';toast('Atendimento movido para '+LEAD_ST.find(x=>x[0]===t.value)[1])},
  perm(){const p=CFG().perfis[t.dataset.p];p.mods=t.checked?[...new Set(p.mods.concat(t.dataset.m))]:p.mods.filter(m=>m!==t.dataset.m)},
  cert(){const f=t.files&&t.files[0];if(!f)return;CFG().cert={nome:f.name,validade:addMonths(TODAY_ISO,12)};toast('Certificado registrado')}
 };
 if(CH[ac]){const r=CH[ac]();save();if(r!==undefined&&r!==null)return;render()}
 else if(CH_EXT[ac]){const r=CH_EXT[ac](t);save();if(r!==undefined&&r!==null)return;render()}
});

 agModal:d=>modalAg(d.id),
 agDel(d){S.agreg=S.agreg.filter(g=>g.id!==+d.id);['d','r'].forEach(x=>delete S.fin.baixas['ag'+d.id+x]);save();closeModal();toast('Lançamento excluído');render()},
 osModal:d=>modalOS(+d.id,d.i),
 retModal:d=>modalRet(d.k),
 contaBancModal:d=>modalContaBanc(d.id),
 /* intermediação */
 novaInt(d){const id=nextId();S.inter[id]={id,tipo:d.tipo,status:'pendente',comprador:null,vendedor:null,veic:{placa:'',marca:'',modelo:'',versao:'',ano:'',km:0,cor:'Prata'},valor:0,debitos:[],servicos:[],taxa:800,taxaQuem:'Comprador',pagamentos:[],vendedorLoja:vendedores().includes(me().nome)?me().nome:vendedores()[0],criado:TODAY_ISO,hist:[{a:'Criada',q:me().nome,d:TODAY_ISO}],assin:{}};save();UI.intStep[id]=0;go('int-'+id)},
 intStep(d){UI.intStep[d.id]=Math.max(0,Math.min(6,+d.st));render();window.scrollTo(0,0)},
 intAdd(d){const x=S.inter[d.id];if(d.list==='debitos')x.debitos.push({desc:'',valor:0});else if(d.list==='servicos')x.servicos.push({custo:null,desc:'Serviço',despesa:0,receita:0,forn:null});else{const c=intCalc(x);const fin=x.tipo==='financiamento'&&!x.pagamentos.some(p=>p.forma==='Financiamento');x.pagamentos.push({forma:fin?'Financiamento':'Pix',valor:Math.max(0,c.falta),data:TODAY_ISO,quem:fin?'Banco':'Comprador',banco:''})}save();render()},
 intDel(d){S.inter[d.id][d.list].splice(+d.i,1);save();render()},
 intStatus(d){
  const x=S.inter[d.id],s=d.s,c=intCalc(x);
  if(s!=='cancelada'){
   if(!x.comprador||!x.vendedor){toast('Informe comprador e vendedor');UI.intStep[d.id]=0;render();return}
   if(x.comprador===x.vendedor){toast('Comprador e vendedor precisam ser pessoas diferentes');UI.intStep[d.id]=0;render();return}
   if(!x.veic.modelo||!(+x.valor)){toast('Informe o veículo e o valor da negociação');UI.intStep[d.id]=1;render();return}
   if(x.tipo==='financiamento'&&!x.pagamentos.some(p=>p.forma==='Financiamento'&&p.banco)){toast('Inclua o pagamento financiado com o banco');UI.intStep[d.id]=4;render();return}
   if(['pendente-contrato','finalizada'].includes(s)&&c.falta!==0){toast('Os pagamentos precisam fechar '+brl2(c.total));UI.intStep[d.id]=4;render();return}
  }
  if(s==='aprovacao'&&x.tipo==='financiamento')x.pagamentos.forEach((p,i)=>{if(p.forma!=='Financiamento')return;const k=`i${x.id}p${i}`;const r=S.fin.retornos[k]||{};if(!r.dataAprov)S.fin.retornos[k]=Object.assign(r,{dataAprov:TODAY_ISO,status:'aberto'})});
  x.status=s;x.hist.unshift({a:{analise:'Enviada ao banco',aprovacao:x.tipo==='financiamento'?'Financiamento aprovado':'Enviada para aprovação','pendente-contrato':'Aprovada',finalizada:'Finalizada',cancelada:'Cancelada'}[s],q:me().nome,d:TODAY_ISO});
  if(['pendente-contrato','finalizada'].includes(s))UI.intStep[d.id]=6;
  save();toast(`Intermediação: ${INT_STATUS[s][0]}`+(s==='pendente-contrato'?'. Taxa lançada no financeiro.':''));render();
 },
 intContrato(d){openModal('Contrato de intermediação',`<div class="doc" id="doc-int">${esc(intContratoTexto(S.inter[d.id]))}</div>`,`<button class="btn" type="button" data-act="closeModal">Fechar</button><button class="btn pri" type="button" data-act="copiar" data-src="doc-int">Copiar texto</button>`,true)},
 intAssin(d){S.inter[d.id].assin={contrato:{st:'enviado',d:TODAY_ISO}};save();toast('Contrato enviado para assinatura (simulado)');render()},
 intAssinOk(d){S.inter[d.id].assin.contrato.st='assinado';save();render()},
 /* consulta veicular */
 cvNova(d){if(!CFG().consulta.ativo){toast('Ative a integração de consulta veicular nas configurações');return}modalConsulta(d.placa)},
 cvAtualizar(){let a=0,b=0;S.consultas.forEach(c=>{if(c.status==='progresso'){c.status='finalizado';c.res=consultaResultado(c.placa,c.tipo);a++}else if(c.status==='fila'){c.status='progresso';b++}});save();toast(`${a} finalizada(s), ${b} em progresso`);render()},
 cvVer(d){const c=S.consultas.find(x=>x.id===+d.id);openModal(`Consulta ${(CONS_TIPOS.find(t=>t[0]===c.tipo)||[])[1]} · ${c.placa}`,`<div class="rows">${c.res.map(([t,v,ok])=>`<div class="row"><span style="display:flex;gap:10px;align-items:center"><span style="color:${ok?'var(--green-strong)':'var(--warn)'}">${ic(ok?'check':'bell')}</span>${esc(t)}</span><b style="color:${ok?'var(--ink)':'var(--warn)'}">${esc(v)}</b></div>`).join('')}</div><p class="small muted" style="margin-top:12px">Consulta de ${dtf(c.data)} por ${esc(c.por)}. Resultado simulado no protótipo.</p>`,`<button class="btn" type="button" data-act="closeModal">Fechar</button>`)}
});
</script>

</body>
</html>
