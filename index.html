  ${todos?`<fieldset><legend>Documentos</legend>${lista.map(k=>`<label class="check"><input type="checkbox" name="ks" value="${k}" ${ks.includes(k)?'checked':''}> ${esc(CONTRATOS[k])}</label>`).join('')}</fieldset>`:''}
  <fieldset><legend>Dados do documento</legend>
   ${mf('Representante da loja',mi('rep',o.rep))}
   <div class="form" style="grid-template-columns:1fr 1fr">${mf('Foro (comarca)',mi('foro',o.foro))}${mf('Prazo de transferência (dias)',mi('prazo',o.prazo,{type:'number'}))}</div>
   ${mf('Multa por desistência (%)',mi('multa',o.multa,{type:'number'}))}
  </fieldset>
  <fieldset><legend>Testemunhas</legend>
   <div class="form" style="grid-template-columns:1.4fr 1fr">${mf('Testemunha 1',mi('t1n',o.t1.nome,{ph:'Nome'}))}${mf('CPF',mi('t1d',o.t1.doc,{ph:'000.000.000-00'}))}${mf('Testemunha 2',mi('t2n',o.t2.nome,{ph:'Nome'}))}${mf('CPF',mi('t2d',o.t2.doc,{ph:'000.000.000-00'}))}</div>
  </fieldset>
  <fieldset><legend>Cláusula adicional</legend><textarea class="inp" name="extra" id="m-extra" rows="3" placeholder="Ex.: o veículo será entregue com tanque cheio e película nos vidros.">${esc(o.extra)}</textarea></fieldset>
  ${pend.length?`<div class="note warn"><b>Confira antes de gerar:</b> ${pend.map(esc).join('; ')}. O documento sai com o campo marcado como não informado.</div>`:''}
 </form>
 <div class="cgen-p"><div class="cgen-pt">${todos?`<select class="inp" id="cprev-sel" aria-label="Documento em pré-visualização">${opts(ks.map(k=>[k,CONTRATOS[k]]),ks[0])}</select>`:`<span class="eyebrow">Pré-visualização</span>`}</div><div id="cprev">${docHTML(contratoDoc(n,ks[0],o))}</div></div>
 </div>`,`<button class="btn" type="button" data-act="contrCopiar">Copiar texto</button><button class="btn" type="button" data-act="contrSai" data-fmt="docx">${ic('download','sm')} Word (.docx)</button><button class="btn pri" type="button" data-act="contrSai" data-fmt="pdf">${ic('download','sm')} ${todos?'Gerar PDF único':'Gerar PDF'}</button>`,true);
 const b=$modal.querySelector('.box');if(b)b.classList.add('xwide');
}
function cFormLer(f){
 const n=S.neg[f.dataset.cform];if(!n)return;const o=cOpts(n),d=new FormData(f);
 o.rep=d.get('rep')||'';o.foro=d.get('foro')||'';o.prazo=+d.get('prazo')||0;o.multa=+d.get('multa')||0;o.t1={nome:d.get('t1n')||'',doc:d.get('t1d')||''};o.t2={nome:d.get('t2n')||'',doc:d.get('t2d')||''};o.extra=d.get('extra')||'';
 if(UI.cMod&&UI.cMod.todos)UI.cMod.ks=d.getAll('ks');
}
function cPrevAtualiza(){
 const m=UI.cMod;if(!m)return;const n=S.neg[m.id],box=document.getElementById('cprev');if(!box)return;
 const sel=document.getElementById('cprev-sel');
 if(sel&&m.todos){const cur=sel.value;sel.innerHTML=opts(m.ks.map(k=>[k,CONTRATOS[k]]),cur);if(!m.ks.includes(cur)&&m.ks[0])sel.value=m.ks[0]}
 const k=sel?sel.value:m.ks[0];m.prev=k;const st=box.scrollTop;box.innerHTML=k?docHTML(contratoDoc(n,k)):'<div class="empty">Selecione ao menos um documento.</div>';box.scrollTop=st;
}
let cPrevT=0;
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('form[data-cform]');if(!f)return;cFormLer(f);clearTimeout(cPrevT);cPrevT=setTimeout(()=>{save();cPrevAtualiza()},180)});
document.addEventListener('change',e=>{if(e.target.id==='cprev-sel'){cPrevAtualiza();return}const f=e.target.closest&&e.target.closest('form[data-cform]');if(f){cFormLer(f);save();cPrevAtualiza()}});
function contrRegistra(n,ks,fmt){
 n.contr=n.contr||{};const s=stamp();
 ks.forEach(k=>{const D=contratoDoc(n,k),old=n.contr[k];n.contr[k]={ver:(old&&!old.minuta&&!D.minuta?old.ver+1:1),num:D.num,em:s.em,por:s.por,minuta:D.minuta,fmt}});
 n.hist.unshift({a:ks.length>1?`Gerou ${ks.length} ${n.status==='rascunho'?'minutas':'contratos'}`:`Gerou ${CONTRATOS[ks[0]].toLowerCase()}`,q:s.por,d:TODAY_ISO});save();
}
const arqNome=(n,ks,ext)=>(ks.length===1?slug(CONTRATOS[ks[0]]):'contratos')+`-negociacao-${n.id}${n.status==='rascunho'?'-minuta':''}.${ext}`;

/* =====================================================================
   ações e mudanças de campo
   ===================================================================== */
Object.assign(ACT,{
 galCapa(d){const v=S.veh[d.id],G=galEnsure(v),[g]=G.splice(+d.i,1);G.unshift(g);touch(v,'anuncios','Trocou a foto de capa');save();toast('Nova capa definida');render()},
 galDel(d){const v=S.veh[d.id],G=galEnsure(v),[g]=G.splice(+d.i,1);v.fotos=G.length;if(g&&g.img)setTimeout(()=>imgDel(g.img),0);touch(v,'anuncios','Removeu uma foto do anúncio');save();toast('Foto removida');render()},
 foto(d){const v=S.veh[d.id],G=galEnsure(v);if(+d.d<0&&G.length){const g=G.pop();if(g.img)setTimeout(()=>imgDel(g.img),0)}else if(+d.d>0&&G.length<40)G.push({id:uid('g'),k:G.length});v.fotos=G.length;save();render()},
 fotoCapa(d){ACT.galCapa(d)},
 fotoMove(d){const v=S.veh[d.id],G=galEnsure(v),i=+d.i,j=i+ +d.d;if(j<0||j>=G.length)return;[G[i],G[j]]=[G[j],G[i]];save();render()},
 entGuiada(d){modalEntGuiada(S.veh[d.id])},
 entIr(d){modalEntGuiada(S.veh[d.id],+d.i)},
 entDel(d){const v=S.veh[d.id],E=entEnsure(v),f=E.f[d.k];delete E.f[d.k];E.fim=null;if(f&&f.img)setTimeout(()=>imgDel(f.img),0);touch(v,'recebimento','Removeu a foto de entrada: '+(ENT_ROTEIRO.find(r=>r[0]===d.k)||[])[1]);save();render()},
 entAvDel(d){const v=S.veh[d.id],E=entEnsure(v),[a]=E.avarias.splice(+d.i,1);if(a&&a.img)setTimeout(()=>imgDel(a.img),0);save();render()},
 entToGal(d){
  const v=S.veh[d.id],E=entEnsure(v),G=galEnsure(v);
  const R=ENT_ROTEIRO.filter(r=>['ext','int'].includes(r[3])&&E.f[r[0]]);if(!R.length){toast('Ainda não há fotos externas ou internas');return}
  const ja=new Set(G.map(g=>g.ent).filter(Boolean));const novos=R.filter(r=>!ja.has(r[0]));
  if(!novos.length){toast('Essas fotos já estão no anúncio');return}
  const reais=G.filter(g=>g.img), add=novos.map(r=>({id:uid('g'),img:E.f[r[0]].img,k:r[4],label:r[1],ent:r[0]}));
  v.galeria=add.concat(reais).slice(0,40);v.fotos=v.galeria.length;
  touch(v,'anuncios',`Usou ${add.length} foto(s) de entrada no anúncio`);save();closeModal();toast(`${add.length} foto(s) de entrada no anúncio. Arraste para ajustar a ordem.`);UI.anTab[v.id]='fotos';UI.vTab[v.id]='anuncios';render();
 },
 mercAtualizar(d){const v=S.veh[d.id],m=mercEnsure(v);m.seed=Date.now()%100000;m.anuncios=mercGerar(v,m.f,m.seed);m.em=nowISO();m.por=me().nome;touch(v,'precificacao','Consultou o mercado: '+m.anuncios.length+' anúncios');save();toast('Consulta de mercado atualizada');render()},
 mercUsar(d){const v=S.veh[d.id];v.prec.simCompra.base='mercado';const s=mercStats(v);touch(v,'precificacao','Usou a média de mercado ('+brl(s.ajustada)+') na precificação de compra');save();toast('Valor de venda previsto: '+brl(s.ajustada)+' (mercado)');render();const el=document.querySelector('.sug-cmp');if(el)el.scrollIntoView({block:'center',behavior:'smooth'})},
 mercVer(d){UI.mercAberto[d.id]=!UI.mercAberto[d.id];render()},
 contrato(d){modalContr(S.neg[d.id],[d.k],false)},
 contrTodos(d){const n=S.neg[d.id];modalContr(n,CONTR_POR_TIPO[n.tipo].slice(),true)},
 async contrPdf(d){const n=S.neg[d.id];const D=contratoDoc(n,d.k);if(await baixarArquivo(arqNome(n,[d.k],'pdf'),docsPDF([D]))){}},
 contrCopiar(){const m=UI.cMod;if(!m)return;const n=S.neg[m.id];copyText(m.ks.map(k=>docTexto(contratoDoc(n,k))).join('\n\n\n'),document.getElementById('cprev'))},
 async contrSai(d){
  const m=UI.cMod;if(!m)return;const f=document.getElementById('cform-'+m.id);if(f)cFormLer(f);
  const n=S.neg[m.id],ks=m.ks.slice();if(!ks.length){toast('Selecione ao menos um documento');return}
  const docs=ks.map(k=>contratoDoc(n,k));
  if(d.fmt==='print'){contrRegistra(n,ks,'impresso');imprimirDocs(docs);render();return}
  const ok=await baixarArquivo(arqNome(n,ks,d.fmt),d.fmt==='pdf'?docsPDF(docs):docsDOCX(docs));
  if(ok){contrRegistra(n,ks,d.fmt==='pdf'?'PDF':'Word');closeModal();UI.cMod=null;render()}
 },
 assin(d){const n=S.neg[d.id];if(!n.contr||!n.contr[d.k]||n.contr[d.k].minuta){toast('Gere o contrato final antes de enviar');return}n.assin=n.assin||{};n.assin[d.k]={st:'enviado',d:TODAY_ISO};n.hist.unshift({a:'Enviou '+CONTRATOS[d.k].toLowerCase()+' para assinatura',q:me().nome,d:TODAY_ISO});save();toast(`${CONTRATOS[d.k]} enviado para assinatura (simulado)`);render()}
});
Object.assign(CH_EXT,{
 fotosAdd(t){const v=S.veh[t.dataset.id];const fs=[...(t.files||[])];t.value='';if(fs.length)galAddFiles(v,fs);return 1},
 entFoto(t){const v=S.veh[t.dataset.id],f=t.files&&t.files[0],k=t.dataset.k;t.value='';if(!f)return 1;lerFotos([f],1280,.74).then(u=>{if(!u.length)return;entSet(v,k,u[0]);touch(v,'recebimento','Foto de entrada: '+(ENT_ROTEIRO.find(r=>r[0]===k)||[])[1]);save();render()});return 1},
 entFotoM(t){const v=S.veh[t.dataset.id],f=t.files&&t.files[0],k=t.dataset.k;t.value='';if(!f)return 1;lerFotos([f],1280,.74).then(u=>{if(!u.length)return;entSet(v,k,u[0]);touch(v,'recebimento','Foto de entrada: '+(ENT_ROTEIRO.find(r=>r[0]===k)||[])[1]);save();render();const prox=ENT_ROTEIRO.findIndex(([kk])=>!v.fotoEnt.f[kk]);modalEntGuiada(v,prox<0?ENT_ROTEIRO.findIndex(r=>r[0]===k):prox);if(prox<0)toast('Sessão de fotos de entrada concluída')});return 1},
 entAv(t){const v=S.veh[t.dataset.id],fs=[...(t.files||[])];t.value='';if(!fs.length)return 1;lerFotos(fs,1280,.74).then(us=>{const E=entEnsure(v),s=stamp();us.forEach(u=>E.avarias.push({img:imgPut(u),desc:'',em:s.em,por:s.por}));touch(v,'recebimento',`Registrou ${us.length} avaria(s) na entrada`);save();render();const el=document.getElementById(`entav-${v.id}-${E.avarias.length-1}`);if(el)el.focus()});return 1}
});
CAMPO_ETAPA.unshift([/^fotoEnt\./,'recebimento']);
Object.assign(CAMPO_LABEL,{'fotoEnt.km':'KM na chegada','fotoEnt.comb':'Combustível na chegada','prec.simCompra.base':'Base do valor de venda previsto','prec.merc.f.reg':'Região da consulta de mercado','prec.merc.f.ano':'Ano da consulta de mercado'});
{const _af=afterSet;afterSet=function(path){_af(path);const ks=path.split('.');if(ks[0]==='veh'&&ks[2]==='prec'&&ks[3]==='merc'&&ks[4]==='f'){const v=S.veh[ks[1]],m=mercEnsure(v);m.anuncios=mercGerar(v,m.f,m.seed);m.em=nowISO();m.por=me().nome}}}

/* migração e dados de demonstração */
function v6Migra(){
 vals(S.veh).forEach(v=>{galEnsure(v)});
 if(!S.v6demo){
  S.v6demo=1;
  const recente=vals(S.veh).filter(v=>v.status==='estoque').sort((a,b)=>daysSince(a.entrada)-daysSince(b.entrada))[0];
  if(recente){const E=entEnsure(recente),s={por:recente.cad?recente.cad.por:me().nome,em:(recente.entrada||TODAY_ISO)+'T09:12'};E.inicio=s;E.km=recente.km;E.comb='50';ENT_ROTEIRO.slice(0,8).forEach((r,i)=>{E.f[r[0]]={img:null,em:(recente.entrada||TODAY_ISO)+'T09:'+String(12+i*2).padStart(2,'0'),por:s.por}});E.avarias.push({img:null,desc:'Risco de aprox. 6 cm no para-choque traseiro',em:s.em,por:s.por})}
  /* negociações já finalizadas antes desta versão: contratos considerados gerados na data da venda */
  vals(S.neg).filter(x=>x.status==='finalizada').forEach(n=>{n.contr=n.contr||{};const dt=(n.hist.find(h=>h.a==='Finalizada')||{}).d||n.criado||TODAY_ISO;CONTR_POR_TIPO[n.tipo].forEach((k,i)=>{if(!n.contr[k])n.contr[k]={ver:1,num:`CT-${n.id}-${String(i+1).padStart(2,'0')}`,em:dt+'T'+String(10+i).padStart(2,'0')+':30',por:n.vendedor,minuta:false,fmt:'PDF'}})});
 }
 save();
}
save=function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!UI._cheio){UI._cheio=1;toast('O navegador ficou sem espaço para salvar. Remova fotos de avaria antigas para continuar salvando.')}}};
v6Migra();imgBoot();

chvEnsure();
render();
</script>
